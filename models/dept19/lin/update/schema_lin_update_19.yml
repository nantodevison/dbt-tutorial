      Ce modèle se base sur la macro [`update_etirer_lin`](/#!/macro/macro.test_otv.update_etirer_lin).
      Il sert à étirer la linéarisation : extension de la linéarisation d'un point de comptage existant
      en y rattachant des lignes BdTopo supplémentaires (étirement de la zone couverte). S'appuie sur le résultat 
      de la correction d'oublis de linéarisation (voir modèle [`lin_update_oubli_erreur_linearisation_19`](/#!/model/model.test_otv.lin_update_oubli_erreur_linearisation_19)).
      Ajoute les lignes supplémentaires en les rattachant au bon id_comptag, avec des valeurs standardisées :
      src_cpt='otv', coment_cpt='linearisation', obs_supl='linearisation etiree traf{annee}', obs_tmja=null, obs_pc_pl=null.
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
      Tous les tests de validation des données sont réalisés au préalable dans le modèle 
      [`creer_vue_19`](/#!/model/model.test_otv.creer_vue_19) et / ou dans le seed 
      [`dept19_update_etire_linearisation`](/#!/seed/seed.test_otv.dept19_update_etire_linearisation).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(src_cpt = 'otv' and coment_cpt = 'linearisation') or (src_cpt is null and coment_cpt = 'estimation')"
            description: "Vérifier la cohérence entre src_cpt et coment_cpt : si src_cpt='otv' alors coment_cpt='linearisation', si src_cpt=null alors coment_cpt='estimation'"
