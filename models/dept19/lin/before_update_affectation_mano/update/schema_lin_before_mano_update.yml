version: 2

models:
  - name: mdl3b_lin_upd_pt_linear_devenu_assoc_19
    description: >
      Ce modèle se base sur la macro [`verifier_pt_linearise_devenu_assoc_lin`](/#!/macro/macro.test_otv.verifier_pt_linearise_devenu_assoc_lin).
      Il vérifie s'il existe des points de comptage référencé dans la vue de base ['mdl1_creer_vue_19'](/#!/model/model.test_otv.mdl1_creer_vue_19)
      qui étaient linéarisés sur un point de comptage dans le millésime précédent mais qui sont devenus des compteurs associés dans le millésime actuel.
      pour les lignes concernées par ces comptages devenenus associés, le modèle récupère l'id_comptag du compteur de référence (id_cpteur_ref). Pour le reste, les valeurs de
      la vue de référence sont conservées.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              NOT EXISTS (
                SELECT 1 
                FROM {{ ref('mdl2h_lin_chk_pt_linear_absent_cptge_19') }} verif
                WHERE verif.id_cpteur_ref = id_comptag 
                AND (src_cpt != 'otv' OR coment_cpt != 'linearisation')
              )
            description: "Vérifier que les lignes dont l'id_comptag correspond à un id_cpteur_ref ont bien src_cpt='otv' et coment_cpt='linearisation'"
          config:
            where: "id_comptag is not null"
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mdl1_creer_vue_19')
            description: "Vérifier que le nombre de lignes dans ce modèle est identique à celui du modèle de base mdl1_creer_vue_19"

  - name: mdl6_lin_upd_auto_pt_non_linear_19
    description: >
      Résultat final du pipeline de linéarisation automatique des points de comptage non linéarisés.
      Basé sur la macro [`mcr_6_maj_auto_pt_non_linear_lin`](/#!/macro/macro.test_otv.mcr_6_maj_auto_pt_non_linear_lin).
      Applique les propositions de matching automatique (id_comptag, src_cpt='otv', coment_cpt='linearisation') 
      aux tronçons respectant les seuils de similarité et distance configurables.
      Utilise une architecture de macros imbriquées pour éviter les cycles de dépendances entre modèles.
      Conserve les lignes non modifiées du modèle source 
      [`mdl3b_lin_upd_pt_linear_devenu_assoc_19`](/#!/model/model.test_otv.mdl3b_lin_upd_pt_linear_devenu_assoc_19).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              EXISTS (
                SELECT 1 
                FROM {{ ref('cte1_mdl6_lin_upd_auto_pt_non_linear_19__choix_cpt_tronc') }} choix
                WHERE choix.id_simpli = id_simpli 
                AND (src_cpt != 'otv' OR coment_cpt != 'linearisation' or id_comptag is null)
              )
            description: "Vérifier que les lignes provenant du modèle choix_cpt_tronc ont bien src_cpt='otv' et coment_cpt='linearisation' et un id_comptag non null"
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mdl1_creer_vue_19')
            description: "Vérifier que le nombre de lignes dans ce modèle est identique à celui du modèle de base mdl1_creer_vue_19"
    columns:
      - name: id_comptag
        description: "Identifiant du compteur : nouvellement assigné pour les lignes automatiquement linéarisées, conservé pour les autres"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: " ~ '[0-9]{2}-(A|N|D|B)[0-9]{1,4}.*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(VC|C).*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(PISTE|VC).*--*[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text OR id_comptag::text ~ '[0-9]{2}-DBAC.*'::text OR id_comptag::text ~ '[a-zA-Z]*.*-[a-zA-Z]*.*--?[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text) AND ((length(id_comptag::text) - length(replace(id_comptag::text, '-'::text, ''::text))) >= 2"
                description: "Vérifier que l'identifiant de comptage respecte les formats OTR"
              config:
                where: "id_comptag is not null"
      - name: id
        description: "Identifiant unique interne OTR généré automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
          - not_null
      - name: src_cpt
        description: "Source du comptage : 'otv' pour les lignes automatiquement linéarisées, valeurs originales pour les autres"
      - name: coment_cpt
        description: "Type de comptage : 'linearisation' pour les lignes automatiquement linéarisées, valeurs originales pour les autres"
      - name: obs_supl
        description: "Observations supplémentaires : 'nouveau point traf{annee}' pour les lignes automatiquement linéarisées, avec historique si obs_supl existante"