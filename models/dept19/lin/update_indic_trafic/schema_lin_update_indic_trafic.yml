          - dbt_utils.expression_is_true:
              arguments:
                expression: "= 'linearisation'"
                where: "src_cpt = 'otv'"
                description: "Vérifier que coment_cpt = 'linearisation' quand src_cpt = 'otv'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= 'estimation'"
                where: "src_cpt is null"
                description: "Vérifier que coment_cpt = 'estimation' quand src_cpt est null"
      - name: src_cpt
        description: "Source du comptage"
      - name: pl
        description: "Nombre de poids lourds brut issu des données de comptage"
  
  - name: mdl_lin_update_coment_tmj_f_estim_19
    description: >
      Modèle final de mise à jour du champ `coment_tmj_f` pour l'ensemble des tronçons.
      Pour les estimations (coment_cpt='estimation' et src_cpt is null), calcule coment_tmj_f selon le sens de circulation.
      Pour les non-estimations, conserve les valeurs existantes.
      C'est le dernier modèle de la partie linearisation - tous les tests finaux de validation doivent être implémentés ici.
      Basé sur la macro [`mcr_update_coment_tmj_f_estimation_lin`](/#!/macro/macro.test_otv.mcr_update_coment_tmj_f_estimation_lin).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('creer_vue_19')
            description: "Vérifier que le nombre de lignes dans ce modèle est identique à celui du modèle de base creer_vue_19"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "((id_comptag::text ~ '[0-9]{2}-(A|N|D|B)[0-9]{1,4}.*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(VC|C).*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(PISTE|VC).*--*[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text OR id_comptag::text ~ '[0-9]{2}-DBAC.*'::text OR id_comptag::text ~ '[a-zA-Z]*.*-[a-zA-Z]*.*--?[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text) AND (length(id_comptag::text) - length(replace(id_comptag::text, '-'::text, ''::text))) >= 2)"
          config:
            where: "id_comptag is not null"
          description: "Vérifier que l'identifiant de comptage respecte les formats OTR"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "CASE WHEN id_comptag IS NULL THEN coment_cpt = 'estimation' WHEN id_comptag IS NOT NULL THEN coment_cpt = 'linearisation' ELSE FALSE END"
            description: "Vérifier la cohérence entre id_comptag et coment_cpt (null->estimation, non-null->linearisation)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "CASE WHEN coment_cpt = 'estimation' THEN src_cpt IS NULL WHEN coment_cpt = 'linearisation' THEN src_cpt IS NOT NULL ELSE FALSE END"
            description: "Vérifier la cohérence entre coment_cpt et src_cpt (estimation->null, linearisation->not null)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coment_tmj_f = '/2' OR coment_tmj_f IS NULL"
            where: "coment_cpt = 'estimation' AND src_cpt IS NULL"
            description: "Vérifier que pour les estimations, coment_tmj_f vaut '/2' (sens unique) ou null (double sens)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coment_tmj_f = '/2'"
            where: "coment_cpt = 'estimation' AND src_cpt IS NULL AND sens = ANY(ARRAY{{ var('bdtopo_sens_uniq_verif') }})"
            description: "Vérifier que coment_tmj_f = '/2' pour les estimations en sens unique"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coment_tmj_f IS NULL"
            where: "coment_cpt = 'estimation' AND src_cpt IS NULL AND sens = '{{ var('bdtopo_double_sens_verif') }}'"
            description: "Vérifier que coment_tmj_f est null pour les estimations en double sens"
    columns:
      - name: id
        description: "Identifiant unique interne OTR généré automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
