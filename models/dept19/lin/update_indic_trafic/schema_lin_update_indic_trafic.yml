  - name: lin_update_coment_tmj_f_lui_mm_19
    description: >
      Modèle de mise à jour manuelle du champ coment_tmj_f sur la base d'une modification
      depuis une valeur de coment_tmj_f vers un autre (on remplace toute les lignes ayant une valeur de coment_tmj_f
      définie manuellement par une autre valeur définie manuellement).
      Basé sur la macro [`update_coment_tmj_f_lui_mm_lin`](/#!/macro/macro.test_otv.update_coment_tmj_f_lui_mm_lin).
      les data_tests implémentés ici sont les mêmes que ceux du modèle `creer_vue_19`.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "((id_comptag::text ~ '[0-9]{2}-(A|N|D|B)[0-9]{1,4}.*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(VC|C).*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(PISTE|VC).*--*[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text OR id_comptag::text ~ '[0-9]{2}-DBAC.*'::text OR id_comptag::text ~ '[a-zA-Z]*.*-[a-zA-Z]*.*--?[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text) AND (length(id_comptag::text) - length(replace(id_comptag::text, '-'::text, ''::text))) >= 2)"
          config:
            where: "id_comptag is not null"
          description: "Vérifier que l'identifiant de comptage respecte les formats OTR"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "CASE WHEN id_comptag IS NULL THEN coment_cpt = 'estimation' WHEN id_comptag IS NOT NULL THEN coment_cpt = 'linearisation' and src_cpt = 'otv' ELSE FALSE END"
            description: "Vérifier la cohérence entre id_comptag et coment_cpt et src_cpt (null->estimation+null, non-null->linearisation+otv)"
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('creer_vue_19')
            description: "Vérifier que le nombre de lignes dans ce modèle est identique à celui du modèle de base creer_vue_19"
    columns:
      - name: id
        description: "Identifiant unique interne OTR généré automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
          - not_null  
      - name: nature
        description: "Nature de la route selon IGN"
