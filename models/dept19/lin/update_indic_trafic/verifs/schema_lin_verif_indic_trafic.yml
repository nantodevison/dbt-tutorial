version: 2

models:
  - name: lin_verif_histo_cptg_suspect_19
    description: >
      Modèle de vérification qui identifie les compteurs linéarisés dont les données de trafic proviennent
      d'années marquées comme suspectes dans la table des comptages.
      Basé sur la macro [`verifier_suspect_indic_lin`](/#!/macro/macro.test_otv.verifier_suspect_indic_lin).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "id_comptag IS NOT NULL AND ann_pt IS NOT NULL"
            description: "Vérifier que tous les enregistrements ont un compteur et une année valides"
    columns:
      - name: id_comptag
        description: "Identifiant du compteur linéarisé utilisant une donnée de comptage suspecte"
        data_tests:
          - unique
      - name: ann_pt
        description: "Année du comptage marquée comme suspecte dans la table comptage.comptage"
  - name: lin_verif_stat_nbpt_lgkm_annee_19
    description: >
      Modèle de vérification des statistiques de linéarisation par année de mise en place 
      des compteurs (ann_pt) : nombre de points de comptage distincts et kilométrage total linéarisé.
      Basé sur la macro [`verifier_stats_linearisation_nbpt_lgkm_annee`](/#!/macro/macro.test_otv.verifier_stats_linearisation_nbpt_lgkm_annee).
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_19`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_19)
      comme source après les mises à jour d'indicateurs de trafic (TMJA, %PL, années).
      Filtre uniquement les tronçons linéarisés par OTV (src_cpt='otv') pour exclure les estimations
      et autres sources de données. 
      Premier modèle de vérification post-mise à jour des indicateurs de trafic.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "nb_pt > 0 AND sum_lg_km > 0"
            description: "Vérifier que chaque année a au moins un compteur et un kilométrage positif"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ann_pt IS NOT NULL"
            description: "Vérifier qu'aucune année n'est NULL (toutes les lignes doivent avoir une année de mise en place)"
    columns:
      - name: nb_pt
        description: "Nombre de compteurs distincts pour l'année de mise en place"
        data_tests:
          - not_null
      - name: sum_lg_km
        description: "Kilométrage total linéarisé pour l'année de mise en place, arrondi à 2 décimales"
        data_tests:
          - not_null
      - name: ann_pt
        description: "Année de mise en place des compteurs au format texte YYYY"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^[0-9]{4}$' AND ann_pt::integer >= 2000 AND ann_pt::integer <= {{ var('annee') }}"
                description: "Vérifier que l'année est au format YYYY et comprise entre 2000 et l'année du projet"
  - name: lin_verif_stat_nbpt_gestionnaires_19
    description: >
      Modèle de vérification des statistiques de linéarisation par gestionnaire :
      nombre de points de comptage distincts pour chaque gestionnaire.
      Basé sur la macro [`verifier_stats_linearisation_nbpt_gest`](/#!/macro/macro.test_otv.verifier_stats_linearisation_nbpt_gest).
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_{{dept}}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_{{dept}})
      comme source finale après toutes les mises à jour d'indicateurs de trafic, et la source 
      [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur) pour récupérer le gestionnaire de chaque compteur.
      Filtre uniquement les tronçons linéarisés (src_cpt='otv') pour exclure les estimations. 
    columns:
      - name: nb_pt
        description: "Nombre de compteurs distincts pour le gestionnaire"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: gestionnai
        description: "Gestionnaire du compteur (CD19, DIR, ASF, APRR, etc.)"
        data_tests:
          - not_null
          - unique

  - name: lin_verif_stat_nbpt_gestionnaires_annees_19
    description: >
      Modèle de vérification des statistiques de linéarisation par gestionnaire et par année de comptage
       : nombre de points de comptage distincts pour chaque gestionnaire et année.
      Basé sur la macro [`verifier_stats_linearisation_gests_annees`](/#!/macro/macro.test_otv.verifier_stats_linearisation_gests_annees).
    columns:
      - name: gestionnai
        description: "Gestionnaire du compteur (CD19, DIR, ASF, APRR, etc.)"
        data_tests:
          - not_null
          - unique
      - name: ann_nb_pt
        description: >
          Chaîne agrégée des années de mise en place et du nombre de compteurs correspondants,
          au format 'YYYY:nb_pt;YYYY:nb_pt;...'
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^([0-9]{4}:[0-9]+;)*([0-9]{4}:[0-9]+)$'"
                description: >
                  Vérifier que le format de la chaîne est correct, avec des paires 'YYYY:nb_pt' séparées par des points-virgules

  - name: lin_verif_coherence_cptg_stdardisation_vs_lin_19
    description: >
      Modèle de vérification qui identifie les incohérences spatiales entre les compteurs linéarisés 
      et les compteurs standardisé. Détecte les cas où des lignes présentent des identifiant de comptage
      différents du compteur géographiquement très proches (< 10m).
      Basé sur la macro [`verifier_coherence_comptag_standardisation_vs_linearisation_lin`](/#!/macro/macro.test_otv.verifier_coherence_comptag_standardisation_vs_linearisation_lin).
      et le modèle [`lin_update_cpt_hors_dept_dans_na_19`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_19).
    columns:
      - name: id_comptag_standardise
        description: "Identifiant du compteur standardisé"
        data_tests:
          - not_null
          - unique
      - name: id_comptag_linearise
        description: "Identifiant du compteur linéarisé"
        data_tests:
          - not_null
          - unique
      - name: dist
        description: "Distance en mètres entre la ligne et le compteur"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                max_value: 10
                description: "Vérifier que la distance est inférieure ou égale à 10 mètres"
      - name: geom
        description: "Géométrie du compteur standard"

  - name: lin_verif_stat_importc_nature_estimee_19
    description: >
      Modèle de vérification des statistiques des tronçons estimés, 
      agrégées par importance et nature de route. 
      Retourne pour chaque combinaison importance/nature existante dans la table (filtrée sur les importances définies par 'importance_verif') :
      le nombre de tronçons estimés, la longueur cumulée en km, et la liste des numéros de route distincts.
      Les combinaisons sans aucune ligne en estimation affichent 0 pour les compteurs et longueurs.
      Basé sur la macro [`verifier_stat_importance_nature_estim_lin`](/#!/macro/macro.test_otv.verifier_stat_importance_nature_estim_lin).
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_19`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_19)
      comme source après les mises à jour d'indicateurs de trafic.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "importance NOT IN ('1', '2') OR (cnt = 0 AND sum_lg_km = 0)"
            description: "Les routes d'importance 1 ou 2 ne devraient pas avoir de tronçons estimés"
          config:
            severity: warn
    columns:
      - name: importance
        description: "Niveau d'importance de la route dans la BDTopo (1=Autoroutière, 2=Principale, etc.)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('importance_verif') }}"
      - name: nature
        description: "Nature de la route dans la BDTopo (Autoroute, Route à 2 chaussées, Route à 1 chaussée, etc.)"
        data_tests:
          - not_null
      - name: cnt
        description: "Nombre de tronçons en mode estimation pour cette combinaison importance/nature (0 si aucun)"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: sum_lg_km
        description: "Longueur cumulée en kilomètres des tronçons estimés, arrondie à 2 décimales (0 si aucun)"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: list_num
        description: "Liste (array) des numéros de route distincts pour les tronçons estimés (NULL si aucun)"

  - name: lin_verif_ann_rrn_indispo_19
    description: >
      Modèle de vérification qui identifie les compteurs du Réseau Routier National (RRN) 
      dont l'année de comptage est antérieure à l'année du millésime en cours.
      Basé sur la macro [`verifier_annee_rrn_pas_dispo`](/#!/macro/macro.test_otv.verifier_annee_rrn_pas_dispo).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "1 = 0"
            description: "Alerter si des compteurs RRN avec année antérieure sont détectés"
          config:
            severity: warn
    columns:
      - name: id_comptag
        description: "Identifiant du compteur RRN (contient '-N%' ou '-A%')"
        data_tests:
          - not_null
          - unique
      - name: ann_pt
        description: "Année de mise en place du compteur au format texte YYYY"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "::integer < {{ var('annee') }}"
                description: "Vérifier que l'année de mise en place est bien antérieure au millésime actuel"
      - name: tmja
        description: "Trafic Moyen Journalier Annuel du compteur"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: ann_pc_pl
        description: "Année du pourcentage de poids lourds"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "IS NULL OR ann_pc_pl::integer <= ann_pt::integer"
                description: "Si ann_pc_pl est renseignée, elle doit être inférieure ou égale à ann_pt"
      - name: pc_pl
        description: "Pourcentage de poids lourds"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "IS NOT NULL OR ann_pc_pl IS NULL"
                description: "Si ann_pc_pl est renseignée, pc_pl doit aussi être renseigné"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
                where: "pc_pl IS NOT NULL"

  - name: lin_verif_coment_tmj_f_val_19
    description: >
      Modèle de vérification qui extrait la liste unique des valeurs du champ coment_tmj_f
      présentes dans les données linéarisées pour le département 19.
      Basé sur la macro [`verifier_coment_tmj_f_values_lin`](/#!/macro/macro.test_otv.verifier_coment_tmj_f_values_lin).
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_19`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_19)
    columns:
      - name: coment_tmj_f
        description: "Commentaire sur le TMJA (Trafic Moyen Journalier Annuel), valeurs distinctes triées"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "IS NULL OR coment_tmj_f ~ '^/\\d+'"
                description: "Vérifier que coment_tmj_f est soit null, soit commence par / suivi de chiffres"

  - name: lin_verif_coment_tmj_f_reseau_ratio_19
    description: >
      Modèle de vérification qui analyse la cohérence des ratios de trafic (coment_tmj_f)
      en fonction du type de réseau routier pour le département 19.
      Extrait le type de réseau (A=Autoroute, N=Nationale, D=Départementale) à partir du 2ème segment 
      de l'id_comptag et le ratio numérique du champ coment_tmj_f (valeur après le slash).
      Basé sur la macro [`verifier_coment_tmj_f_reseau_ratio_lin`](/#!/macro/macro.test_otv.verifier_coment_tmj_f_reseau_ratio_lin).
    columns:
      - name: reseau
        description: "Type de réseau routier : A (Autoroute), N (Nationale), D (Départementale)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'N', 'D']
      - name: ratio
        description: "Ratio de division du TMJA pour le calcul du trafic sur les bretelles ou voies spécifiques"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2
                max_value: 30

  - name: lin_verif_id_comptag_part1_post_coment_tmj_f_19
    description: >
      Modèle de vérification qui extrait la liste unique des départements ou agglo présents 
      dans les identifiants de comptage (id_comptag) après les mises à jour de coment_tmj_f.
      Utilise la première partie de l'id_comptag (avant le premier '-').
      Basé sur la macro [`verifier_split_id_comptag_lin`](/#!/macro/macro.test_otv.verifier_split_id_comptag_lin).
    columns:
      - name: split_part
        description: "Code du département extrait de la première partie de l'id_comptag (peut être numérique ou textuel pour les communes)"
        data_tests:
          - not_null
          - unique

  - name: lin_verif_coment_tmj_f_attr_modif_19
    description: >
      Modèle de vérification qui identifie les troncons linéarisés dont le champ `coment_tmj_f` pourrait avoir été modifié
      à cause d'une variation dans le champs natif bdtopo "importance".
      Filtre les troncons RRN (dont la 2e partie de l'id_comptag commence par 'A' (Autoroute) ou 'N' (Nationale))
      et possédant un champ attr_modif renseigné.
      Basé sur la macro [`verifier_coment_tmj_f_attr_modif`](/#!/macro/macro.test_otv.verifier_coment_tmj_f_attr_modif).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "left(split_part(id_comptag, '-', 2), 1) IN ('A', 'N')"
            description: "Vérifier que tous les enregistrements concernent bien des routes nationales ou autoroutes"
    columns:
      - name: id_ign
        description: "Identifiant IGN du tronçon routier de la BDTopo"
        data_tests:
          - not_null
          - unique
      - name: id_comptag
        description: "Identifiant du compteur (avec 'A' ou 'N' en début du 2ème segment)"
        data_tests:
          - not_null
      - name: nature
        description: "Nature de la route selon la BDTopo (Autoroute, Route à 2 chaussées, Route à 1 chaussée, etc.)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: '{{ var("nature_verif") }}'
      - name: numero
        description: "Numéro de la route (ex: A89, N89, etc.)"
      - name: importance
        description: "Niveau d'importance de la route dans la BDTopo (1=Autoroutière, 2=Principale, etc.)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: '{{ var("importance_verif") }}'

  - name: lin_verif_coment_tmj_f_recup_19
    description: >
      Modèle de vérification qui identifie les tronçons du Réseau Routier National (RRN)
      ayant un mode de récupération (champ recup) différent de 'pk_ign' ou 'ad'.
      Filtre les compteurs dont l'id_comptag commence par 'A' (Autoroute) ou 'N' (Nationale)
      dans le second segment de l'identifiant.
      Basé sur la macro [`verifier_coment_tmj_f_recup`](/#!/macro/macro.test_otv.verifier_coment_tmj_f_recup).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "left(split_part(id_comptag, '-', 2), 1) IN ('A', 'N')"
            description: "Vérifier que tous les enregistrements concernent bien des routes nationales ou autoroutes"
    columns:
      - name: id_ign
        description: "Identifiant IGN du tronçon routier de la BDTopo"
        data_tests:
          - not_null
          - unique
      - name: id_comptag
        description: "Identifiant du compteur (avec 'A' ou 'N' en début du 2ème segment)"
        data_tests:
          - not_null
      - name: numero
        description: "Numéro de la route (ex: A89, N89, etc.) - affiche 'NULL' si non renseigné"
        data_tests:
          - not_null
      - name: nature
        description: "Nature de la route selon la BDTopo (Autoroute, Route à 2 chaussées, Route à 1 chaussée, etc.)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: '{{ var("nature_verif") }}'
      - name: importance
        description: "Niveau d'importance de la route dans la BDTopo (1=Autoroutière, 2=Principale, etc.)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: '{{ var("importance_verif") }}'
      - name: sens
        description: "Sens de circulation du tronçon routier"
        data_tests:
          - accepted_values:
                arguments:
                  values: '{{ var("sens_verif") }}'
      - name: coment_tmj_f
        description: "Commentaire sur le TMJA (Trafic Moyen Journalier Annuel)"
      - name: recup
        description: "Mode de récupération du tronçon lors de la linéarisation (valeur atypique différente de 'pk_ign' ou 'ad')"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "NOT IN ('pk_ign', 'ad')"
                description: "Confirmer que la valeur de recup est bien atypique"

  - name: lin_verif_numero_rrn_19
    description: >
      Extrait la liste distincte des numéros de routes
      du Réseau Routier National (RRN) présents dans les tronçons linéarisés.
      Basé sur la macro [`verifier_numero_rrn_lin`](/#!/macro/macro.test_otv.verifier_numero_rrn_lin).
    columns:
      - name: numero
        description: "Numéro de route du Réseau Routier National (RRN) présent dans les tronçons linéarisés"
        data_tests:
          - not_null
          - unique
          - dbt_utils.expression_is_true:
              arguments:
                expression: " ~ '^(A|N)\\d+' "
                description: "Vérifier que le numéro correspond bien à une rout du RRN"

  - name: lin_verif_vals_abertes_tmja_19
    description: >
      Modèle de vérification qui identifie les valeurs aberrantes de TMJA (Trafic Moyen Journalier Annuel)
      en analysant l'évolution entre deux millésimes consécutifs.
      Filtre les variations importantes selon deux critères cumulatifs :
      - Évolution en pourcentage (par défaut > 20%)
      - Différence absolue de TMJA (par défaut > 300 véhicules/jour)
      Permet de détecter les incohérences ou erreurs potentielles dans les données de trafic
      nécessitant une investigation approfondie.
      Basé sur la macro [`verifier_valeurs_aberrantes_tmja`](/#!/macro/macro.test_otv.verifier_valeurs_aberrantes_tmja).
    data_tests:
      - dbt_utils.expression_is_true:
              arguments:
                expression: "abs(diff_n_n_1) <= {{ var('seuil_diff_tmja_verif') }}"
                description: "Alerter si la différence dépasse le seuil défini par seuil_diff_tmja_verif"
              config:
                severity: warn
      - dbt_utils.expression_is_true:
              arguments:
                expression: "abs(evol_n_n_1) <= {{ var('seuil_evol_tmja_verif') }}"
                description: "Alerter si l'évolution dépasse le seuil défini par seuil_evol_tmja_verif"
              config:
                severity: warn
    columns:
      - name: id_comptag
        description: "Identifiant du compteur présentant une variation aberrante de TMJA"
        data_tests:
          - not_null
          - unique
      - name: annee_n
        description: "Année de référence (année N) pour laquelle la variation aberrante est détectée"
        data_tests:
          - not_null
      - name: annee_n_1
        description: "Année de comparaison (année N-1) utilisée pour calculer l'évolution"
        data_tests:
          - not_null
      - name: tmja_n
        description: "Valeur du TMJA pour l'année N"
        data_tests:
          - not_null
      - name: tmja_n_1
        description: "Valeur du TMJA pour l'année N-1"
        data_tests:
          - not_null
      - name: diff_n_n_1
        description: "Différence absolue de TMJA entre l'année N et l'année N-1 (tmja_n - tmja_n_1)"
        data_tests:
          - not_null
      - name: evol_n_n_1
        description: "Évolution en pourcentage du TMJA entre l'année N et l'année N-1 ((tmja_n - tmja_n_1) / tmja_n_1 * 100)"
        data_tests:
          - not_null
      - name: percentile_value
        description: "Valeur de percentile calculée sur l'évolution (optionnel, présent uniquement si le paramètre percentile_value est fourni)"

  - name: mdl_lin_verif_evol_cpt_dev_assoc_19
    description: >
      Modèle de vérification qui analyse l'évolution du trafic (TMJA) entre l'année N et N-1 
      pour les compteurs devenus associés. Compare les valeurs de trafic d'un compteur associé 
      (via son compteur de référence) entre deux années et calcule la différence absolue 
      et l'évolution en pourcentage.
      Basé sur la macro [`verifier_evol_cpt_dev_assoc_lin`](/#!/macro/macro.test_otv.verifier_evol_cpt_dev_assoc_lin).
      Renvoi un warning si l'évolution en pourcentage dépasse le seuil défini par la variable `seuil_evol_tmja_verif`.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(evol_n_n_1) <= {{ var('seuil_evol_tmja_verif') }}"
            description: "Alerter si l'évolution du trafic des compteurs devenus associés dépasse le seuil"
          config:
            severity: warn
    columns:
      - name: id_cpteur_asso
        description: "Identifiant du compteur associé"
        data_tests:
          - not_null
          - unique
      - name: ann_lin_n_1
        description: "Année de comptage N-1 pour le compteur associé"
        data_tests:
          - not_null
      - name: tmja_lin_n_1
        description: "Valeur du TMJA à l'année N-1 pour le compteur associé"
        data_tests:
          - not_null
      - name: typ_post_lin_n_1
        description: "Type de poste du compteur à l'année N-1"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: '{{ var("type_poste_verif") }}'
      - name: id_cpteur_ref
        description: "Identifiant du compteur de référence auquel le compteur associé est rattaché"
        data_tests:
          - not_null
      - name: ann_lin_n
        description: "Année de comptage N pour le compteur de référence"
        data_tests:
          - not_null
      - name: tmja_lin_n
        description: "Valeur du TMJA à l'année N pour le compteur de référence"
        data_tests:
          - not_null
      - name: typ_post_lin_n
        description: "Type de poste du compteur de référence à l'année N"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: '{{ var("type_poste_verif") }}'
      - name: diff_n_n_1
        description: "Différence absolue de TMJA entre l'année N et l'année N-1 (tmja_lin_n - tmja_lin_n_1), arrondie"
        data_tests:
          - not_null
      - name: evol_n_n_1
        description: "Évolution en pourcentage du TMJA entre l'année N et l'année N-1 ((tmja_lin_n - tmja_lin_n_1) / tmja_lin_n_1 * 100), arrondie à 2 décimales"
        data_tests:
          - not_null

  - name: lin_verif_periode_19
    description: >
      Modèle de vérification qui identifie les compteurs ponctuels et tournants 
      (départementaux et d'agglomération) dont la période de comptage se situe en juillet ou août (période estivale).
      Basé sur la macro [`verifier_periode_lin`](/#!/macro/macro.test_otv.verifier_periode_lin).
      S'appuie sur la source [`cptg.vue_compteur_last_annee_know_tmja_pc_pl`](/#!/source/source.test_otv.cptg.vue_compteur_last_annee_know_tmja_pc_pl)
      et le modèle [`lin_update_coment_tmj_f_ids_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_ids_{dept}).
    columns:
      - name: id_comptag
        description: "Identifiant du compteur ponctuel ou tournant départemental ou d'agglomération avec comptage estival"
        data_tests:
          - not_null
          - unique
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^({{ var('dept') }}-D{% for agglo in var('agglo_' ~ var('dept')) %}|{{ agglo }}-{% endfor %})'"
                description: "Vérifier que l'identifiant correspond bien à un compteur départemental du département {{ var('dept') }} ou d'agglomération ({{ var('agglo_' ~ var('dept')) | join(', ') }})"
      - name: type_poste
        description: "Type de poste du compteur (valeurs attendues : 'ponctuel' ou 'tournant')"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ponctuel', 'tournant']
      - name: periode
        description: "Période de comptage contenant '/07/' ou '/08/' pour les mois d'été"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '/(07|08)/'"
                description: "Confirmer la présence de juillet ou août dans la période"

  - name: mdl_lin_verif_ann_cptgassoc_cptgref_19
    description: >
      Modèle de vérification qui identifie les incohérences temporelles entre les compteurs associés 
      et leurs compteurs de référence. Détecte les cas où un compteur associé possède des données 
      de trafic (TMJA) plus récentes (annee_tmja) que l'année de mise en place du compteur de référence (ann_pt) 
      utilisé dans la linéarisation.
      Basé sur la macro [`mcr_verifier_ann_cptgassoc_cptgref_lin`](/#!/macro/macro.test_otv.mcr_verifier_ann_cptgassoc_cptgref_lin).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "annee_tmja::int > ann_pt::int"
            description: "Vérifier que tous les compteurs associés ont une année de TMJA postérieure à l'année du compteur de référence"
    columns:
      - name: id_comptag
        description: "Identifiant du compteur de référence utilisé dans la linéarisation"
      - name: type_poste
        description: "Type de poste du compteur de référence (permanent, ponctuel, tournant)"
      - name: tmja
        description: "TMJA (Trafic Moyen Journalier Annuel) du compteur de référence utilisé dans la linéarisation"
      - name: ann_pt
        description: "Année de mise en place du compteur de référence dans la linéarisation"
      - name: periode
        description: "Période de comptage du compteur de référence (mois du comptage), NULL si non renseigné"
      - name: id_cpteur_asso
        description: "Identifiant du compteur associé ayant des données plus récentes"
      - name: annee_tmja
        description: "Année du TMJA du compteur associé (plus récente que ann_pt du compteur de référence)"

  - name: mdl_lin_verif_comptag_sens_uniq_19
    description: >
      Modèle de vérification qui identifie les compteurs configurés en sens unique
      dans la base de données et présents dans les données linéarisées.
      Basé sur la macro [`mcr_verifier_cptg_sens_unique_lin`](/#!/macro/macro.test_otv.mcr_verifier_cptg_sens_unique_lin).
      Effectué après la premiere MaJ du champ `coment_tmj_f`.
    columns:
      - name: id_comptag
        description: "Identifiant du compteur"
        data_tests:
          - unique
          - not_null

  - name: mdl_lin_verif_sens_bretelles_rrn_19
    description: >
      Modèle de vérification qui identifie les incohérences entre le sens de circulation 
      des bretelles RRN (entrées/sorties) dans la BDTopo et le sens configuré dans la table 
      des compteurs, en contrôlant la validité du coefficient `coment_tmj_f`.
      Basé sur la macro [`mcr_verifier_sens_bretelles_rrn_lin`](/#!/macro/macro.test_otv.mcr_verifier_sens_bretelles_rrn_lin).
    columns:
      - name: id_ign
        description: "Identifiant IGN du tronçon BDTopo linéarisé"
        data_tests:
          - not_null
          - unique
      - name: id_comptag
        description: "Identifiant du compteur (bretelle d'entrée ou sortie RRN)"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '((E|n)tree|(S|s)ortie)'"
                description: "Vérifier que l'identifiant contient bien 'Entree', 'entree', 'Sortie' ou 'sortie'"
      - name: sens
        description: "Sens de circulation du tronçon dans la BDTopo"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('sens_verif') }}"
      - name: sens_cpt
        description: "Sens configuré dans la table des compteurs"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["{{ var('cptg_sens_uniq_verif') }}", "{{ var('cptg_double_sens_verif') }}"]
      - name: coment_tmj_f
        description: "Coefficient multiplicateur ou diviseur appliqué au TMJA"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_tmj_verif') }}"
              config:
                where: "coment_tmj_f IS NOT NULL"
      - name: verif_coment_tmj_f
        description: "Indicateur de cohérence (false = incohérence détectée)"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= false"
                description: "Vérifier que seules les lignes avec incohérence sont retournées"
      - name: obs_supl
        description: "Observations supplémentaires sur le tronçon"

  - name: mdl_lin_verif_recup_agglo_19
    description: >
      Modèle de vérification qui analyse le statut de récupération (champ `recup`) 
      des tronçons linéarisés par gestionnaire d'agglomération.
      Identifie les tronçons gérés par les agglomérations définies dans la variable projet `agglo_19`
      et compte leur répartition selon la présence ou non d'une valeur dans le champ `recup`.
      Permet de suivre quels tronçons ont été récupérés ou modifiés pour chaque gestionnaire d'agglomération.
      Basé sur la macro [`mcr_verifier_recup_agglo_lin`](/#!/macro/macro.test_otv.mcr_verifier_recup_agglo_lin).
    columns:
      - name: gest
        description: "Gestionnaire de l'agglomération (extrait de la première partie de l'id_comptag)"
        data_tests:
          - not_null
      - name: recup
        description: "Statut de récupération du tronçon (NULL si non récupéré, valeur spécifique si récupéré/modifié)"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('recup_verif') }}"
      - name: cnt
        description: "Nombre de tronçons linéarisés pour la combinaison gestionnaire/statut recup"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
                description: "Vérifier que le compteur est strictement positif"

  - name: mdl_lin_verif_cptg_sens_uniq_occurc2_19
    description: >
      Modèle de vérification qui identifie les compteurs configurés en sens unique
      dans la base de données et présents dans les tronçons linéarisés après mise à jour
      du champ `coment_tmj_f` et du sens de circulation.
      Filtre uniquement ceux dont le sens de comptage (`sens_cpt`) 
      correspond à la valeur de sens unique définie dans la variable `cptg_sens_uniq_verif`.
      Basé sur la macro [`mcr_verifier_cptg_sens_unique_lin`](/#!/macro/macro.test_otv.mcr_verifier_cptg_sens_unique_lin).
      Retourne uniquement les identifiants des compteurs (id_comptag).
      Effectué après la seconde MaJ du champ `coment_tmj_f`.
    columns:
      - name: id_comptag
        description: "Identifiant du compteur configuré en sens unique"
        data_tests:
          - not_null
          - unique

  - name: mdl_lin_verif_sens_troncon_prch_cptg_19
    description: >
      Vérifie la cohérence entre le sens de comptage (sens_cpt) (issu des données gestionnaires)
      et le sens du tronçon BDTopo (sens) linéarisés le plus proches.
      Basé sur la macro [`mcr_verifier_sens_tronc_proche_cpt_lin`](/#!/macro/macro.test_otv.mcr_verifier_sens_tronc_proche_cpt_lin).
    columns:
      - name: id_comptag
        description: "Identifiant du compteur présentant une incohérence de sens"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
      - name: obs_supl
        description: "Observations supplémentaires sur le compteur"
      - name: dept
        description: "Code du département"
        data_tests:
          - not_null
      - name: gestionnai
        description: "Gestionnaire de la route"
        data_tests:
          - not_null
      - name: type_poste
        description: "Type de poste de comptage (permanent, ponctuel, tournant)"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('type_poste_verif') }}"
      - name: sens_cpt
        description: "Sens de comptage configuré dans la table compteur"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["{{ var('cptg_sens_uniq_verif') }}", "{{ var('cptg_double_sens_verif') }}"]
      - name: id_ign
        description: "Identifiant IGN du tronçon BDTopo le plus proche du compteur"
        data_tests:
          - not_null
          - unique
      - name: sens_ign
        description: "Sens de circulation du tronçon BDTopo (sens unique ou double sens)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('sens_verif') }}"
      - name: coment_tmj_f
        description: "Commentaire TMJA final actuel (null, '*2', ou '/2')"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_tmj_verif') }}"
              config:
                where: "coment_tmj_f IS NOT NULL"
      - name: nature
        description: "Nature du tronçon routier selon la BDTopo"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('toute_nature_verif') }}"
      - name: verif_coment_tmj_f
        description: "Résultat de la vérification de cohérence entre sens_cpt et sens (false = incohérence détectée)"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= false"
                description: "Ce modèle ne retourne que les lignes avec incohérence (verif_coment_tmj_f = false)"

  - name: mdl_lin_verif_sens_coment_tmj_f_horsagglo_19
    description: >
      Vérifie la cohérence entre le sens des compteurs (sens_cpt) et le champ coment_tmj_f 
      des tronçons linéarisés hors agglomération. 
      Basé sur la macro [`mcr_verifier_sens_coment_tmj_f_hors_agglo_lin`](/#!/macro/macro.test_otv.mcr_verifier_sens_coment_tmj_f_hors_agglo_lin).
    columns:
      - name: id_ign
        description: "Identifiant IGN du tronçon BDTopo présentant une incohérence"
        data_tests:
          - not_null
          - unique
      - name: id_comptag
        description: "Identifiant du compteur associé au tronçon"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
      - name: sens
        description: "Sens de circulation du tronçon BDTopo"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('sens_verif') }}"
      - name: sens_cpt
        description: "Sens de comptage configuré dans la table compteur"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["{{ var('cptg_sens_uniq_verif') }}", "{{ var('cptg_double_sens_verif') }}"]
      - name: coment_tmj_f
        description: "Commentaire TMJA final actuel (null, '*2', ou '/2')"
        data_tests:
          - accepted_values:
              arguments:
                values: ["*2", "/2"]
              config:
                where: "coment_tmj_f IS NOT NULL"
      - name: verif_coment_tmj_f
        description: "Résultat de la vérification de cohérence entre sens_cpt, sens et coment_tmj_f (false = incohérence détectée)"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= false"
                description: "Ce modèle ne retourne que les lignes avec incohérence (verif_coment_tmj_f = false)"
      - name: obs_supl
        description: "Observations supplémentaires sur le tronçon"

  - name: mdl_lin_verif_recup_linear_19
    description: >
      Modèle de vérification qui analyse les tronçons linéarisés 
      issus de la récupération.
      Basé sur la macro [`mcr_verifier_recup_linearisation_lin`](/#!/macro/macro.test_otv.mcr_verifier_recup_linearisation_lin).
    columns:
      - name: cnt
        description: "Nombre de tronçons linéarisés pour chaque valeur de recup"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: recup
        description: "Mode de récupération des données entre millésimes (pk_ign, ad, topo_n, imp, recurs, etc.)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('recup_verif') }}"

  - name: mdl_lin_verif_id_comptag_millessime_en_cours_19
    description: >
      Modèle de vérification qui extrait la liste distincte des identifiants de comptage (id_comptag)
      linéarisés pour l'année du millésime en cours.
      Basé sur la macro [`mcr_verifer_id_comptag_mill_en_cours_lin`](/#!/macro/macro.test_otv.mcr_verifer_id_comptag_mill_en_cours_lin).
    columns:
      - name: id_comptag
        description: "Identifiant du comptage OTR utilisé pour la linéarisation de l'année en cours"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
                description: "Vérifier que l'identifiant existe dans la table des compteurs"