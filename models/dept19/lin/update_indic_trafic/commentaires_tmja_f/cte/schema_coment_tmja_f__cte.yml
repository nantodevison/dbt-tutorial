version: 2

models:
  - name: cte1_mdl13d_lin_chk_histo_traf
    description: >
      Modèle de vérification qui compare l'historique des données de trafic linéarisées
      avec les données sources des comptages.
      Basé sur la macro [`cte_verif_historique_trafic_lin`](/#!/macro/macro.test_otv.cte_verif_historique_trafic_lin).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: " coalesce({% for a in range(var('annee'), 1999, -1) | list + [1900] %} tmja_{{ a }} {{ \",\" if not loop.last }} {% endfor %}) is not null "
    columns:
      - name: id_comptag
        description: "Identifiant du compteur linéarisé avec historique des données de trafic"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag

  - name: cte2_mdl13c_lin_upd_cpt_hors_dept_dans_na_19__list_cpt
    description: >
      Identifie les compteurs situés géographiquement hors du département
      étudié mais présents dans la région Nouvelle-Aquitaine.
      Basé sur la macro [`cte_verif_cpt_hors_dept_dans_na_lin__list_cpt`](/#!/macro/macro.test_otv.cte_verif_cpt_hors_dept_dans_na_lin__list_cpt).
      Doit permettre la mise à jour des indicateurs de trafic pour ces compteurs,
      dont certaines valeurs peuvent ne pas être disponibles (en fonction du cycle d'import de chaque département).
    columns:
      - name: id_comptag
        description: "Identifiant du compteur situé dans la région NA mais hors du département étudié"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
                description: "Vérifier que les compteurs hors département existent dans la table source"
      - name: type_poste
        description: "Type de poste du compteur (cf enumération bdd)"
        data_tests:
          - not_null

  - name: cte1_mdl13c_lin_upd_cpt_hors_dept_dans_na_19__auto
    description: >
      Modèle CTE qui enrichit les compteurs hors département (issus du modèle 
      [`cte2_mdl13c_lin_upd_cpt_hors_dept_dans_na_19__list_cpt`](/#!/model/model.test_otv.cte2_mdl13c_lin_upd_cpt_hors_dept_dans_na_19__list_cpt))
      avec leurs dernières données de trafic disponibles pour l'année spécifiée.
      Basé sur la macro [`cte_verif_cpt_hors_dept_dans_na_lin__auto`](/#!/macro/macro.test_otv.cte_verif_cpt_hors_dept_dans_na_lin__auto).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: " ((pl IS NULL AND pc_pl IS NULL) OR (pc_pl IS NOT NULL AND pl IS NOT NULL))"
            description: "Vérifier la cohérence entre pc_pl et pl (tous deux NULL ou tous deux renseignés)"  
    columns:
      - name: id_comptag
        description: "Identifiant du compteur d'un autre département NA avec données de trafic disponibles pour l'année"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('cte2_mdl13c_lin_upd_cpt_hors_dept_dans_na_19__list_cpt')
                field: id_comptag
                description: "Vérifier que les compteurs enrichis font partie de la liste des compteurs hors département"
      - name: tmja
        description: "Trafic Moyen Journalier Annuel tous véhicules pour l'année spécifiée"
        data_tests:
          - not_null
      - name: annee_tmja
        description: "Année du TMJA (correspond à var('annee'))"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= '{{ var('annee') }}'"
                description: "Vérifier que l'année correspond à l'année du projet"
      - name: pc_pl
        description: "Pourcentage Poids Lourds pour l'année spécifiée (peut être NULL)"
      - name: pl
        description: "Trafic PL calculé automatiquement (tmja × pc_pl / 100), NULL si pc_pl manquant"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 150000
                where: "pl is not null"
                description: "Vérifier que le trafic PL calculé est positif et inférieur à 150000"

  - name: cte1_mdl14g_lin_chk_coher_cpt_std_lin_19__cpt_lin
    description: >
      Modèle CTE qui récupère les informations des compteurs (id, type, sens, géométrie)
      présents dans la linearisation.
      Basé sur la macro [`cte_verif_coherence_cpt_std_lin__cpt_lin`](/#!/macro/macro.test_otv.cte_verif_coherence_cpt_std_lin__cpt_lin).
    columns:
      - name: id_comptag
        description: "Identifiant du compteur standard"
      - name: type_poste
        description: "Type de poste du compteur (cf enumération bdd)"
      - name: sens_cpt
        description: "Sens du comptage"
      - name: geom
        description: "Géométrie du compteur"

  - name: cte1_mdl15e_lin_chk_vals_aberr_tmja_19__ann_n_n_1
    description: >
      Modèle CTE de vérification qui extrait l'historique des TMJA sur le millésime 
      actuel et les deux comptages précédents.
      (année N, N-1, N-2) pour chaque compteur linéarisé, permettant ainsi l'analyse
      des variations de trafic et la détection de valeurs aberrantes.
      Basé sur la macro [`cte_verif_valeurs_aberrantes_tmja__ann_n_n_1`](/#!/macro/macro.test_otv.cte_verif_valeurs_aberrantes_tmja__ann_n_n_1).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "id_comptag IS NOT NULL AND annee_n IS NOT NULL AND tmja_n IS NOT NULL"
            description: "Vérifier que tous les enregistrements ont un compteur, une année et un TMJA valides pour l'année N"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(annee_n_1 IS NULL AND annee_n_2 IS NULL) OR (annee_n_1 IS NOT NULL AND annee_n::integer > annee_n_1::integer AND (annee_n_2 IS NULL OR annee_n_1::integer > annee_n_2::integer))"
            description: "Vérifier la cohérence de l'ordre chronologique des années : annee_n > annee_n_1 > annee_n_2, et si annee_n_1 est NULL alors annee_n_2 doit être NULL"
    columns:
      - name: id_comptag
        description: "Identifiant du compteur linéarisé avec historique de trafic"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
      - name: annee_n
        description: "Année N du TMJA (année la plus récente pour ce compteur)"
        data_tests:
          - not_null
      - name: tmja_n
        description: "Trafic Moyen Journalier Annuel tous véhicules pour l'année N"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 200000
      - name: annee_n_1
        description: "annee du comptage précédant le millésime actuel, peut être NULL si pas d'historique"
      - name: annee_n_2
        description: "annee du comptage précédant le comptage précédant le millésime actuel, peut être NULL si historique insuffisant"
      - name: tmja_n_1
        description: "TMJA du comptage précédant le millésime actuel (peut être NULL si pas de données disponibles)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 300000
                where: "tmja_n_1 IS NOT NULL"
      - name: tmja_n_2
        description: "TMJA du comptage précédant le comptage précédant le millésime actuel (peut être NULL si pas de données disponibles)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 300000
                where: "tmja_n_2 IS NOT NULL"

  - name: cte2_mdl15e_lin_chk_vals_aberr_tmja_19__evo_ann_n_n_1
    description: >
      Modèle CTE de vérification qui calcule l'évolution des valeurs de TMJA entre l'année N 
      et l'année N-1 pour détecter les valeurs aberrantes.
      Pour chaque point de comptage, extrait la dernière année disponible et calcule la différence 
      absolue (diff_n_n_1) et l'évolution en pourcentage (evol_n_n_1) du trafic entre N et N-1.
      Retourne également le nombre total d'années disponibles par compteur (nb_ann) et les valeurs 
      TMJA des années N, N-1 et N-2.
      Basé sur la macro [`cte_verif_valeurs_aberrantes_tmja__evol_ann_n_n_1`](/#!/macro/macro.test_otv.cte_verif_valeurs_aberrantes_tmja__evol_ann_n_n_1).
      Renvoi des warnings si les différences ou évolutions sont hors des plages raisonnables.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(diff_n_n_1 IS NULL AND evol_n_n_1 IS NULL AND tmja_n_1 IS NULL) OR (diff_n_n_1 IS NOT NULL AND evol_n_n_1 IS NOT NULL AND tmja_n_1 IS NOT NULL)"
            description: "Vérifier la cohérence entre diff_n_n_1, evol_n_n_1 et tmja_n_1 : soit tous NULL, soit tous renseignés"
    columns:
      - name: id_comptag
        description: "Identifiant du compteur linéarisé avec calcul d'évolution de trafic"
        data_tests:
          - not_null
          - unique
      - name: nb_ann
        description: "Nombre total d'années de données de trafic disponibles pour ce compteur"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 50
      - name: annee_n
        description: "Année N du TMJA (année la plus récente pour ce compteur)"
        data_tests:
          - not_null
      - name: annee_n_1
        description: "Année du comptage précédant le millésime actuel (peut être NULL si pas d'historique)"
      - name: annee_n_2
        description: "Année du comptage précédant le comptage précédant le millésime actuel (peut être NULL si historique insuffisant)"
      - name: tmja_n
        description: "Trafic Moyen Journalier Annuel tous véhicules pour l'année N"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 300000
      - name: tmja_n_1
        description: "TMJA du comptage précédant le millésime actuel (peut être NULL si pas de données disponibles)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 300000
                where: "tmja_n_1 IS NOT NULL"
      - name: tmja_n_2
        description: "TMJA du comptage précédant le comptage précédant le millésime actuel (peut être NULL si pas de données disponibles)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 300000
                where: "tmja_n_2 IS NOT NULL"
      - name: diff_n_n_1
        description: "Différence absolue de TMJA entre l'année N et l'année N-1 (tmja_n - tmja_n_1), NULL si pas de N-1"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -150000
                max_value: 150000
                where: "diff_n_n_1 IS NOT NULL"
                description: "Vérifier que la différence de TMJA reste dans une plage raisonnable"
              config:
                severity: warn
      - name: evol_n_n_1
        description: "Évolution en pourcentage du TMJA entre N et N-1 : ((tmja_n - tmja_n_1) / tmja_n_1) × 100, arrondi à 2 décimales, NULL si pas de N-1"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -100.00
                max_value: 200.00
                where: "evol_n_n_1 IS NOT NULL"
                description: "Vérifier que l'évolution en pourcentage reste dans une plage raisonnable (max ±1000%)"
              config:
                severity: warn
      - name: suspect
        description: "indicateur de suspicion de la donnée de trafic (booléen) provenant de la table source des comptages"
        data_tests:
          - not_null
      - name: obs
        description: "Observation ou commentaire associé à la donnée de trafic provenant de la table source des comptages"

  - name: cte2_mdl16e_lin_chk_evo_cpt_dev_assoc_19__id_cptg_n
    description: >
      Modèle CTE de vérification qui identifie les points de comptage présents dans 
      la linéarisation de l'année N (millésime actuel).
      Basé sur la macro [`cte_verif_evol_cpt_devenu_assoc__id_cptg_n`](/#!/macro/macro.test_otv.cte_verif_evol_cpt_devenu_assoc__id_cptg_n).
    columns:
      - name: id_comptag
        description: "Identifiant du compteur présent dans la linéarisation de l'année N"
        data_tests:
          - not_null
          - unique

  - name: cte3_mdl16e_lin_chk_evo_cpt_dev_assoc_19__id_cptg_n_1
    description: >
      Modèle CTE de vérification qui identifie les points de comptage présents dans 
      la linéarisation de l'année N-1 (année précédente).
      Basé sur la macro [`cte_verif_evol_cpt_devenu_assoc__id_cptg_n_1`](/#!/macro/macro.test_otv.cte_verif_evol_cpt_devenu_assoc__id_cptg_n_1).
    columns:
      - name: id_comptag
        description: "Identifiant du compteur présent dans la linéarisation de l'année N-1"
        data_tests:
          - not_null
          - unique
      - name: ann_pt
        description: "Année du comptage dans la linéarisation N-1 (ann_pt de la table lineaire de l'année précédente)"
      - name: tmja
        description: "Trafic Moyen Journalier Annuel tous véhicules pour l'année N-1"

  - name: cte4_mdl16e_lin_chk_evo_cpt_dev_assoc_19__pt_ann_n
    description: >
      Modèle CTE de vérification qui identifie les points de comptage présents dans 
      la linéarisation de l'année N-1 mais absents de la linéarisation de l'année N (devenus des comptages associés).
      Basé sur la macro [`cte_verif_evol_cpt_devenu_assoc__pt_ann_n`](/#!/macro/macro.test_otv.cte_verif_evol_cpt_devenu_assoc__pt_ann_n).
    columns:
      - name: id_comptag
        description: "Identifiant du compteur présent en N-1 mais absent de la linéarisation en N (devenu associé)"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg_assoc', 'compteur')
                field: id_cpteur_asso
                description: "Vérifier que les compteurs disparus esont dans la table source des compteurs_assoc"
      - name: ann_pt
        description: "Année du comptage dans la linéarisation N-1 (ann_pt de la table lineaire de l'année précédente)"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "::integer >= 1900 AND ann_pt::integer <= 2100"
                description: "Vérifier que l'année est dans une plage cohérente"
      - name: tmja
        description: "Trafic Moyen Journalier Annuel tous véhicules pour l'année N-1 (tmja de la table lineaire de l'année précédente)"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 300000
                description: "Vérifier que le TMJA N-1 est dans une plage raisonnable"

  - name: cte1_mdl16e_lin_chk_evo_assoc_19__pt_ann_n_asso
    description: >
      Modèle CTE de vérification qui détaille les compteurs devenus associés (issus du modèle 
      [`cte4_mdl16e_lin_chk_evo_cpt_dev_assoc_19__pt_ann_n`](/#!/model/model.test_otv.cte4_mdl16e_lin_chk_evo_cpt_dev_assoc_19__pt_ann_n))
      avec leurs informations de trafic, type de poste et compteur de référence issues de la table des compteurs associés.
      Basé sur la macro [`cte_verif_evol_cpt_devenu_assoc__pt_ann_n_asso`](/#!/macro/macro.test_otv.cte_verif_evol_cpt_devenu_assoc__pt_ann_n_asso).
    columns:
      - name: id_comptag
        description: "Identifiant du compteur devenu associé ; equivalent à id_cpteur_asso"
      - name: id_cpteur_asso
        description: "Identifiant du compteur devenu associé"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg_assoc', 'compteur')
                field: id_cpteur_asso
                description: "Vérifier que les compteurs enrichis font partie de la liste des compteurs devenus associés"
      - name: ann_pt
        description: "Année du comptage dans la linéarisation N-1"
      - name: tmja
        description: "Trafic Moyen Journalier Annuel tous véhicules pour l'année N-1"
      - name: typ_poste
        description: "Type de poste du compteur dans la linéarisation N-1 (cf enumération bdd)"
      - name: id_cpteur_ref
        description: "Identifiant du compteur de référence auquel le compteur associé est lié"