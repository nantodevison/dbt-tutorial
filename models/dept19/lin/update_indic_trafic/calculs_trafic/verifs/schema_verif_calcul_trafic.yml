version: 2

models:
  - name: mdl14a_lin_chk_stat_nbpt_gest_19
    description: >
      Modèle de vérification des statistiques de linéarisation par gestionnaire :
      nombre de points de comptage distincts pour chaque gestionnaire.
      Basé sur la macro [`verifier_stats_linearisation_nbpt_gest`](/#!/macro/macro.test_otv.verifier_stats_linearisation_nbpt_gest).
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_{{dept}}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_{{dept}})
      comme source finale après toutes les mises à jour d'indicateurs de trafic,
      et la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur) pour récupérer le gestionnaire de chaque compteur.
      Filtre uniquement les tronçons linéarisés (src_cpt='otv') pour exclure les estimations.
    columns:
      - name: nb_pt
        description: "Nombre de compteurs distincts pour le gestionnaire"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: gestionnai
        description: "Gestionnaire du compteur (CD19, DIR, ASF, APRR, etc.)"
        data_tests:
          - not_null
          - unique

  - name: mdl14b_lin_chk_stat_nbpt_gest_annees_19
    description: >
      Modèle de vérification des statistiques de linéarisation par gestionnaire et par année de comptage :
      nombre de points de comptage distincts pour chaque gestionnaire et année.
      Basé sur la macro [`verifier_stats_linearisation_gests_annees`](/#!/macro/macro.test_otv.verifier_stats_linearisation_gests_annees).
    columns:
      - name: gestionnai
        description: "Gestionnaire du compteur (CD19, DIR, ASF, APRR, etc.)"
        data_tests:
          - not_null
          - unique
      - name: ann_nb_pt
        description: >
          Chaîne agrégée des années de mise en place et du nombre de compteurs correspondants,
          au format 'YYYY:nb_pt;YYYY:nb_pt;...'
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^([0-9]{4}:[0-9]+;)*([0-9]{4}:[0-9]+)$'"
                description: >
                  Vérifier que le format de la chaîne est correct, avec des paires 'YYYY:nb_pt' séparées par des points-virgules

  - name: mdl14c_lin_chk_stat_nbpt_lgkm_annee_19
    description: >
      Modèle de vérification des statistiques de linéarisation par année de mise en place 
      des compteurs (ann_pt) : nombre de points de comptage distincts et kilométrage total linéarisé.
      Basé sur la macro [`verifier_stats_linearisation_nbpt_lgkm_annee`](/#!/macro/macro.test_otv.verifier_stats_linearisation_nbpt_lgkm_annee).
      Utilise le modèle [`mdl13c_lin_upd_cpt_hors_dept_dans_na_19`](/#!/model/model.test_otv.mdl13c_lin_upd_cpt_hors_dept_dans_na_19)
      comme source après les mises à jour d'indicateurs de trafic (TMJA, %PL, années).
      Filtre uniquement les tronçons linéarisés par OTV (src_cpt='otv') pour exclure les estimations
      et autres sources de données. 
      Premier modèle de vérification post-mise à jour des indicateurs de trafic.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "nb_pt > 0 AND sum_lg_km > 0"
            description: "Vérifier que chaque année a au moins un compteur et un kilométrage positif"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ann_pt IS NOT NULL"
            description: "Vérifier qu'aucune année n'est NULL (toutes les lignes doivent avoir une année de mise en place)"
    columns:
      - name: nb_pt
        description: "Nombre de compteurs distincts pour l'année de mise en place"
        data_tests:
          - not_null
      - name: sum_lg_km
        description: "Kilométrage total linéarisé pour l'année de mise en place, arrondi à 2 décimales"
        data_tests:
          - not_null
      - name: ann_pt
        description: "Année de mise en place des compteurs au format texte YYYY"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^[0-9]{4}$' AND ann_pt::integer >= 2000 AND ann_pt::integer <= {{ var('annee') }}"
                description: "Vérifier que l'année est au format YYYY et comprise entre 2000 et l'année du projet"

  - name: mdl23b_lin_stats_linear_19
    description: >
      Modèle de vérification générant des statistiques synthétiques sur l'état de la linéarisation pour le département 19.
      Retourne une seule ligne avec l'ensemble des indicateurs clés permettant de suivre l'avancement et la qualité du processus de linéarisation.
      Basé sur la macro [`mcr_statistiques_linearisation`](/#!/macro/macro.test_otv.mcr_statistiques_linearisation).
      Ce modèle est placé dans le schéma 'verif' pour servir d'outil de contrôle qualité final.
      S'appuie sur le modèle [`mdl22_lin_upd_cmt_tmj_f_estim_19`](/#!/model/model.test_otv.mdl22_lin_upd_cmt_tmj_f_estim_19).
    columns:
      - name: long_tot
        description: "Longueur totale du réseau routier en km (toutes routes confondues)"
      - name: long_lin
        description: "Longueur totale linéarisée en km (coment_cpt='linearisation')"
      - name: long_lin_pt_ann_n
        description: "Longueur linéarisée avec des points de comptage de l'année N en km (src_cpt='otv' et ann_pt=année en cours)"
      - name: long_lin_pt_inf_ann_n
        description: "Longueur linéarisée avec des points de comptage antérieurs à l'année N en km (src_cpt='otv' et ann_pt<année en cours)"
      - name: compteur_otv
        description: "Nombre total de compteurs OTV distincts utilisés pour la linéarisation (src_cpt='otv')"
      - name: compteur_otv_pt_ann_n
        description: "Nombre de compteurs OTV avec des données de l'année N (src_cpt='otv' et ann_pt=année en cours)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 40
                description: "Vérifier qu'au moins 40 compteurs OTV ont des données de l'année en cours"
              config:
                severity: warn
      - name: compteur_otv_pt_inf_ann_n
        description: "Nombre de compteurs OTV avec des données antérieures à l'année N (src_cpt='otv' et ann_pt<année en cours)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 100
                description: "Vérifier qu'au moins 100 compteurs OTV ont des données d'années antérieures"
              config:
                severity: warn
      - name: prc_lin_tot
        description: "Pourcentage du réseau total qui est linéarisé (long_lin / long_tot * 100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 30
                description: "Vérifier qu'au moins 30% du réseau total est linéarisé"
              config:
                severity: warn
      - name: prc_lin_ann_n
        description: "Pourcentage du réseau total linéarisé avec des données de l'année N (long_lin année N / long_tot * 100)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 20
                description: "Vérifier qu'au moins 20% du réseau total est linéarisé avec des données de l'année en cours"
              config:
                severity: warn
      - name: lin_ann_n_lin_tot
        description: "Pourcentage de la linéarisation année N par rapport à la linéarisation totale (long_lin année N / long_lin * 100)"

  - name: mdl18b_lin_chk_id_cptg_mill_en_cours_19
    description: >
      Modèle de vérification qui extrait la liste distincte des identifiants de comptage (id_comptag)
      linéarisés pour l'année du millésime en cours.
      Basé sur la macro [`mcr_verifer_id_comptag_mill_en_cours_lin`](/#!/macro/macro.test_otv.mcr_verifer_id_comptag_mill_en_cours_lin).
    columns:
      - name: id_comptag
        description: "Identifiant du comptage OTR utilisé pour la linéarisation de l'année en cours"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
                description: "Vérifier que l'identifiant existe dans la table des compteurs"

  - name: mdl14d_lin_chk_indic_agrege_after_upd_19
    description: >
      Modèle de vérification des indicateurs agrégés de comptage
      pour une liste spécifique d'identifiants de comptage (id_comptag) après les mises à jour.
      Basé sur la macro [`mcr_verifier_indic_agrege_after_update_lin`](/#!/macro/macro.test_otv.mcr_verifier_indic_agrege_after_update_lin).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id_comptag
              - annee
              - indicateur
    columns:
      - name: id_comptag
        description: "Identifiant du comptage"
        data_tests:
          - not_null
      - name: annee
        description: "Année du comptage"
        data_tests:
          - not_null
      - name: type_poste
        description: "Type de poste de comptage (permanent, ponctuel, tournant)"
        data_tests:
          - not_null
      - name: id
        description: "Identifiant unique de l'enregistrement dans la table indic_agrege"
      - name: id_comptag_uniq
        description: "Identifiant unique du comptage (clé étrangère vers comptage.comptage)"
      - name: indicateur
        description: "Type d'indicateur de trafic (doit correspondre à une valeur de la variable indic_agrege_verif : tmja, v85, v50, vma_vl, vma_pl, vmoy_vl, tmjo, tmje, tmjhe, vma, vmoy_pl, vmoy, v85_vl, v85_pl, v50_vl, v50_pl, pc_pl, pc_pl_o, pc_pl_e, pc_pl_he)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('indic_agrege_verif') }}"
      - name: valeur
        description: "Valeur numérique de l'indicateur de trafic"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: " >= 0 AND valeur <= 100"
                description: "Vérifier que la valeur du pc_pl est comprise entre 0 et 100"
              config:
                where: "indicateur = 'pc_pl'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: " > 0"
                description: "Vérifier que la valeur du tmja est strictement positive"
              config:
                where: "indicateur = 'tmja'"
      - name: fichier
        description: "Nom du fichier source contenant les données d'indicateur"

  - name: mdl21b_lin_chk_pc_pl_after_upd_final_19
    description: >
      Modèle de vérification qui identifie les tronçons linéarisés où le pourcentage de poids lourds (pc_pl)
      est null après la mise à jour des indicateurs pl_final et pl_km.
      Retourne le nombre total de tronçons concernés, le nombre de compteurs distincts affectés,
      et la liste des identifiants de comptage.
      Basé sur la macro [`mcr_verifier_pc_pl_after_update_final_lin`](/#!/macro/macro.test_otv.mcr_verifier_pc_pl_after_update_final_lin).
    columns:
      - name: count
        description: "Nombre total de tronçons linéarisés où pc_pl est null"
      - name: count_distinct_id_comptag
        description: "Nombre de compteurs distincts concernés par pc_pl null"
      - name: list_id_comptag
        description: "Liste (array) des identifiants de comptage distincts où pc_pl est null"
      - name: list_split1_id_comptag
        description: "Liste (array) des premières parties des identifiants de comptage distincts (split_part(id_comptag, '-', 1)) où pc_pl est null"

  - name: mdl21c_lin_chk_pc_pl_after_upd_group_gest_19
    description: >
      Modèle de vérification qui identifie les tronçons linéarisés où le pourcentage de poids lourds (pc_pl)
      est null après la mise à jour des indicateurs pl_final et pl_km, avec agrégation par gestionnaire.
      Filtre uniquement les enregistrements où coment_cpt='linearisation' et pc_pl is null.
      Groupe les résultats par gestionnaire et retourne le nombre de compteurs distincts pour chaque gestionnaire.
      Le gestionnaire est extrait de l'id_comptag via split_part sur le premier segment avant '-'.
      Basé sur la macro [`mcr_verifier_pc_pl_after_update_group_gest_lin`](/#!/macro/macro.test_otv.mcr_verifier_pc_pl_after_update_group_gest_lin).
    columns:
      - name: cnt_cpt
        description: "Nombre de compteurs distincts concernés par pc_pl null pour ce gestionnaire"
        data_tests:
          - not_null
      - name: gest
        description: "Code du gestionnaire (extrait du premier segment de l'id_comptag)"

  - name: mdl18c_lin_chk_recup_linear_19
    description: >
      Modèle de vérification qui analyse les tronçons linéarisés 
      issus de la récupération.
      Basé sur la macro [`mcr_verifier_recup_linearisation_lin`](/#!/macro/macro.test_otv.mcr_verifier_recup_linearisation_lin).
    columns:
      - name: cnt
        description: "Nombre de tronçons linéarisés pour chaque valeur de recup"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: recup
        description: "Mode de récupération des données entre millésimes (pk_ign, ad, topo_n, imp, recurs, etc.)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('recup_verif') }}"
