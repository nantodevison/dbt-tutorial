      Il sert à modifier la linéarisation (id_comptag) de ligne affectées à un autre point de comptage.
      Contrairement au modèle [`mdl7_lin_upd_nouv_point_19`](/#!/model/model.test_otv.mdl7_lin_upd_nouv_point_19) qui traite 
      les nouveaux points de comptage, ce modèle modifie uniquement la linéarisation de comptages déjà présents.
      Tous les tests de validation des données sont réalisés au préalable dans le modèle 
      [`mdl1_creer_vue_19`](/#!/model/model.test_otv.mdl1_creer_vue_19) et / ou dans le seed 
      [`sed8_dept19_upd_modif_linear`](/#!/seed/seed.test_otv.sed8_dept19_upd_modif_linear) et 
      s'appuie sur les résultats du modèle [`mdl7_lin_upd_nouv_point_19`](/#!/model/model.test_otv.mdl7_lin_upd_nouv_point_19).
      Seuls l'identifiants de linéarisation (id_comptag) est modifié, tous les autres attributs 
      restent inchangés par rapport au modèle source.
    data_tests:
