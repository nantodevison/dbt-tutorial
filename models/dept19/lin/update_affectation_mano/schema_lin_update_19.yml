  - name: mdl7_lin_upd_nouv_point_19
    description: >
      Ce modèle se base sur la macro [`update_nouveau_point_lin`](/#!/macro/macro.test_otv.update_nouveau_point_lin).
      Il sert à remplacer les attributs de lignes affectées ou désaffectées à des points de comptages.
      Tous les tests de validation des données sont réalisés au préalable dans le modèle 
      [`mdl1_creer_vue_19`](/#!/model/model.test_otv.mdl1_creer_vue_19) et / ou dans le seed 
      [`sed7_dept19_upd_nouv_pt`](/#!/seed/seed.test_otv.sed7_dept19_upd_nouv_pt).
      A terme, o, pourrait enlever les colonnes tmja, pc_pl, etc... qui font doublons avec les donnée contenues dans le schéma comptage
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              not EXISTS (
                SELECT 1 
                FROM {{ ref('sed7_dept19_upd_nouv_pt') }} seed
                WHERE ((array[id_ign] && seed.id_ign and seed.id_ign is not null)
                      OR 
                      id_simpli = seed.id_simpli and seed.id_simpli is not null)
                AND (src_cpt != 'otv' OR coment_cpt != 'linearisation')
              )
            description: "Vérifier que les lignes issues du seed sed7_dept19_upd_nouv_pt ont bien src_cpt='otv' et coment_cpt='linearisation'"
          config:
            where: "id_comptag is not null"
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mdl1_creer_vue_19')
            description: "Vérifier que le nombre de lignes dans ce modèle est identique à celui du modèle de base mdl1_creer_vue_19"
