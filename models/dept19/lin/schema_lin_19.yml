  - name: lin_update_vers_estimation_19
    description: >
      Ce modèle se base sur la macro [`update_vers_estimation_lin`](/#!/macro/macro.test_otv.update_vers_estimation_lin).
      Il sert à faire basculer des lignes BDTopo linéarisées vers un statut d'estimation. S'appuie sur le résultat de l'étirement de linéarisation 
      (voir modèle [`lin_update_etire_lin_19`](/#!/model/model.test_otv.lin_update_etire_lin_19)).
      Cette macro transforme les lignes spécifiées en supprimant les références de comptage (id_comptag=null, src_cpt=null) 
      et en passant en mode estimation (coment_cpt='estimation', obs_tmja='auto', obs_pc_pl='auto').
      L'historique de transformation est conservé dans obs_supl avec l'ancien id_comptag et l'année précédente.
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
      Ce modele est le dernier du cbloc de MaJ d'affectation de linearisation, les tests du modele 
      [`creer_vue_19`](/#!/model/model.test_otv.creer_vue_19) sont donc réappliqués ici.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "((id_comptag::text ~ '[0-9]{2}-(A|N|D|B)[0-9]{1,4}.*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(VC|C).*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(PISTE|VC).*--*[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text OR id_comptag::text ~ '[0-9]{2}-DBAC.*'::text OR id_comptag::text ~ '[a-zA-Z]*.*-[a-zA-Z]*.*--?[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text) AND (length(id_comptag::text) - length(replace(id_comptag::text, '-'::text, ''::text))) >= 2)"
          config:
            where: "id_comptag is not null"
          description: "Vérifier que l'identifiant de comptage respecte les formats OTR"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "CASE WHEN id_comptag IS NULL THEN coment_cpt = 'estimation' WHEN id_comptag IS NOT NULL THEN coment_cpt = 'linearisation' ELSE FALSE END"
            description: "Vérifier la cohérence entre id_comptag et coment_cpt (null->estimation, non-null->linearisation)"
    columns:
      - name: id
        description: "Identifiant unique interne OTR généré automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
          - not_null
      - name: nature
      - name: nom_coll_g
      - name: nom_coll_d
      - name: numero
      - name: importance
      - name: cl_admin
      - name: gestion
      - name: fictif
      - name: largeur
      - name: nb_voies
      - name: sens
      - name: etat
      - name: inseecom_g
      - name: inseecom_d
      - name: id_voie_g
      - name: id_voie_d
      - name: urbain
      - name: vit_moy_vl
      - name: restr_p
      - name: dept
      - name: dept_2024
      - name: dept_2023
      - name: long_km
      - name: coment_cpt
        description: "Type de comptage : 'estimation' pour les lignes transformées via le seed, autres valeurs pour les lignes non modifiées"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_cpt_verif') }}"
      - name: src_cpt
        description: "Source du comptage : null pour les lignes transformées vers estimation via le seed, autres valeurs pour les lignes non modifiées"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('src_cpt_verif') }}"
      - name: id_comptag
      - name: src_cpteur
      - name: obs_supl
        description: "Observations supplémentaires : 'maj a estimation traf{annee},ex {ancien_id_comptag} traf{annee_prec}' pour les lignes transformées via le seed"
      - name: ann_pt
        description: "Année du point de comptage : null pour les lignes transformées vers estimation via le seed"
      - name: coment_tmj
        description: "Calcul sur le tmja (ex : /2 si sens = Direct ou Inverse) pour déterminer le tmja final repris du millésime N-1"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_tmj_verif') }}"
      - name: coment_tmj_f
        description: "Calcul sur le tmja (ex : /2 si sens = Direct ou Inverse) pour déterminer le tmja final validé"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_tmj_verif') }}"
      - name: tmja
      - name: tmja_final
      - name: veh_km
      - name: ann_pc_pl
      - name: pc_pl
      - name: pl
      - name: pl_final
      - name: pl_km
      - name: obs_tmja
        description: "Observations TMJA : 'auto' pour les lignes transformées vers estimation via le seed"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('obs_tmja_pc_pl_verif') }}"
      - name: obs_pc_pl
        description: "Observations pourcentage PL : 'auto' pour les lignes transformées vers estimation via le seed"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('obs_tmja_pc_pl_verif') }}"
      - name: id_cpt1
        description: "Identifiant compteur 1 : null pour les lignes transformées vers estimation via le seed"
