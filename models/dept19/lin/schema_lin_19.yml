  - name: lin_update_oubli_erreur_linearisation_19
    description: >
      Ce modèle se base sur la macro [`update_oubli_erreur_lin`](/#!/macro/macro.test_otv.update_oubli_erreur_lin).
      Il sert à corriger les oublis de linéarisation : rattachement de lignes BdTopo qui auraient dû être incluses
      dès la linéarisation initiale mais qui ont été omises. S'appuie sur le résultat de la modification de linéarisation
      (voir modèle [`lin_update_modif_linearisation_19`](/#!/model/model.test_otv.lin_update_modif_linearisation_19)).
      Cette macro ajoute les lignes oubliées en les rattachant au bon id_comptag, avec des valeurs standardisées :
      src_cpt='otv', coment_cpt='linearisation', obs_supl=null, obs_tmja=null, obs_pc_pl=null.
      Tous les tests de validation des données sont réalisés au préalable dans le modèle 
      [`creer_vue_19`](/#!/model/model.test_otv.creer_vue_19) et / ou dans le seed 
      [`dept19_update_oubli_linearisation`](/#!/seed/seed.test_otv.dept19_update_oubli_linearisation).
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(src_cpt = 'otv' and coment_cpt = 'linearisation') or (src_cpt is null and coment_cpt = 'estimation')"
            description: "Vérifier la cohérence entre src_cpt et coment_cpt : si src_cpt='otv' alors coment_cpt='linearisation', si src_cpt=null alors coment_cpt='estimation'"
