version: 2

models:
  - name: lin_verif_nbpt_lgkm_19
    description: "Vérification du nombre de points de comptage et de la longueur totale linéarisée à partir de ceux-ci"
    columns:
      - name: nb_pt
        description: "Nombre de points de comptage"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: sum_lg_km
        description: "Longueur totale linéarisée en km"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
  - name: lin_verif_nature_19
    description: >
      Vérification des valeurs prise par l'attribut nature. Cherche les valeurs aberrantes (sentier, routes empierree...).
      Ce modèle utilise les données de [`creer_vue_19`](/#!/model/model.test_otv.creer_vue_19).
    columns:
      - name: coment_cpt
        description: "nature de la linéarisation parmi *estimation* ou *linearisation*"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('coment_cpt_verif')}}" # a remplacer par une variable
                description: "Vérifier que les valeurs de l'attribut nature sont valides"
      - name: nature
        description: "nature bdTopo louche parmi *Sentier*, *Chemin*, *Route empierrée*"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('rejected_nature_verif') }}" # passer ça ailleur dans une variable plus tard
                description: "Vérifier que les valeurs de l'attribut nature sont celles attendues, i.e pas les plus communes, mais pas non plus les plus louches (genre *Bac ou liaison maritime*)"
      - name: sum_lg_km
        description: "Longueur totale linéarisée en km"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                description: "Vérifier que moins de 1km est en nature inattendue"
      - name: cnt
        description: "Nombre de tronçons concernés par la nature inattendue"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                description: "Vérifier que si une nature est inattendue, au moins 1 tronçon est concerné"
  - name: lin_verif_gest_bdtopo_19
    description: >
      Vérification des valeurs du champs gestionaire. 
      Ce modèle référence les valeurs de [`lin_verif_gest_bdtopo_19_n_1`](/#!/model/model.test_otv.lin_verif_gest_bdtopo_19_n_1) 
      et [`lin_verif_gest_bdtopo_compare_19`](/#!/model/model.test_otv.lin_verif_gest_bdtopo_compare_19).
    columns:
      - name: gestionaire
        description: "Valeur BdTopo des gestionnaires"
        data_tests:
          - relationships:
              arguments:
                to: ref('lin_verif_gest_bdtopo_19_n_1')
                field: gestionaire
      - name: id
        description: "Identifiant unique généré automatiquement"
        data_tests:
          - not_null
          - unique
      - name: annee
        description: "Sert principalement pour jointure dans le modele *lin_verif_gest_bdtopo_compare_19*"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^_\d{4}$'
                description: "Vérifier que l'année est au format _YYYY"
  - name: lin_verif_gest_bdtopo_19_n_1
    description: >
      Ce modèle sert de base à la comparaison des gestionnaires présents dans la bdtopo, 
      en fournissant les gestionnaires de l'année précédente à celle étudiée. 
      Il est basé sur la macro `verifier_gestionnaire_bdtopo_lin` (qui s'appuie sur le modèle 
      [`creer_vue_19`](/#!/model/model.test_otv.creer_vue_19) lui même issu de la macro `creer_vue_dept_annee`) 
      et sert de référence au test de relationship du modèle [`lin_verif_gest_bdtopo_19`](/#!/model/model.test_otv.lin_verif_gest_bdtopo_19).
    columns:
      - name: gestionaire
        description: "Gestionnaire de la voie selon la BDTopo IGN"
      - name: annee
        description: "Année de référence des données (_YYYY)"
      - name: id
        description: "Identifiant unique généré automatiquement"
  - name: lin_verif_dept_limitrophe_19
    description: >
      Ce modèle retourne la liste des départements limitrophes au département 19 (Corrèze),
      en excluant les départements de la région Nouvelle-Aquitaine. Il est utilisé par le modèle [`lin_verif_cptg_limitrophe_19`](/#!/model/model.test_otv.lin_verif_cptg_limitrophe_19)
      pour vérifier les comptages existants. Il utilise les géométries
      des communes et départements pour déterminer la contiguïté spatiale. Ils servent ensuite à vérifier si des comptages
      existent sur ces départements
    columns:
      - name: insee_dep
        description: "Code INSEE à 2 chiffres du département limitrophe au 19, hors Nouvelle-Aquitaine."
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:  
                values: ['15', '46', '63']
                description: "Doit contenir uniquement les codes INSEE des départements limitrophes à la Corrèze (hors Nouvelle-Aquitaine), codés sur 2 chiffres."
  - name: lin_verif_cptg_limitrophe_19
    description: >
      Ce modèle permet de vérifier les comptages présents en base de données pour les départements limitrophes à la Corrèze (19) (défini dans [`lin_verif_dept_limitrophe_19`](/#!/model/model.test_otv.lin_verif_dept_limitrophe_19)),
      mais en dehors des départements de la région Nouvelle-Aquitaine

      Sources web complémentaires pour certains départements limitrophes :
        - Cantal (15) : https://www.cantal.fr/comptages/
        - Puy-de-Dôme (63) : https://www.puy-de-dome.fr/routes-deplacements.html ou https://www.puy-de-dome.fr/open-data.html
        - Lot (46) : 
            - Données trafic : https://lot.fr/le-trafic-sur-les-routes-du-lot-en-d-tail
            - Carte 2024 : https://lot.fr/sites/lot.fr/files/trafic_mja-2024.pdf
    columns:
      - name: gid
        description: "Identifiant unique de la ligne dans la vue 'vue_compteur_last_annee_know_tmja_pc_pl'."
      - name: id_comptag
        description: "Identifiant du compteur"
      - name: route
        description: "Nom de la route"
      - name: type_poste
        description: "Type de poste de comptage (permanent, temporaire, ponctuel)."
      - name: annee_tmja
        description: "Année de référence pour la valeur tmja."
      - name: tmja
        description: "Trafic Moyen Journalier Annuel (TMJA)."
      - name: pc_pl
        description: "Pourcentage de Poids Lourds (PL) dans le trafic."
      - name: annee_pc_pl
        description: "Année de référence pour le pourcentage de PL."
      - name: geom
        description: "Géométrie du point de comptage "
      - name: gestionnai
        description: "gestionnaire du point de comptage."

  - name: lin_verif_gest_bdtopo_compare_19
    description: >
      Ce modèle permet une comparaison facilitée des résultats des modèles 
      [`lin_verif_gest_bdtopo_19`](/#!/model/model.test_otv.lin_verif_gest_bdtopo_19) et 
      [`lin_verif_gest_bdtopo_19_n_1`](/#!/model/model.test_otv.lin_verif_gest_bdtopo_19_n_1).
    columns:
      - name: gestionnaire_annee_n
        description: "Gestionnaires présentes dans la BDTopo IGN pour l'année N"
      - name: gestionnaire_annee_2
        description: "Gestionnaires présentes dans la BDTopo IGN pour l'année N-1"

  - name: lin_verif_attr_modif_19
    description: >
      Ce modèle met en evidence les attributs (`nature`, `coment_cpt`, `numero`, 
      `importance`, `obs_supl`) des tronçons routiers d'un millésime 
      de la BDTopo dont certains attributs varient avec le millésime précédent
       (analyse de l'attribut `attr_modif`, traduction de variation sur `importance` et `numero`). 
       Il est basé sur la macro [`verifier_attr_modif_bdtopo_lin`](/#!/macro/macro.test_otv.verifier_attr_modif_bdtopo_lin).
    columns:
      - name: id_ign
        description: "Identifiant IGN du tronçon"
        data_tests:
          - not_null
          - unique
      - name: nature
        description: "nature selon la BdTopo"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('nature_verif') }}" # a remplacer par une variable
      - name: coment_cpt
        description: "Valeur de l'attribut dans le millésime précédent"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('coment_cpt_verif')}}" # a remplacer par une variable
      - name: id_comptag # tests à rédiger : not_null si coment_cpt = linearisation, null si coment_cpt=estimation
        description: "Identifiant du compteur"
      - name: num_n
        description: "numero du millésime actuel de la route selon la BdTopo"
      - name: num_n_1
        description: "numero du millésime précédent de la route selon la BdTopo"
      - name: imp_n
        description: "importance du millésime actuel selon la BdTopo"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('importance_verif') }}" # a remplacer par une variable
      - name: imp_n_1
        description: "importance du millésime précédent selon la BdTopo"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('importance_verif') }}" # a remplacer par une variable
      - name: obs_n
        description: "Observations supplémentaires millésime actuel"
      - name: obs_n_1
        description: "Observations supplémentaires millésime précédent"

  - name: lin_verif_pt_sans_geom_19
    description: >
      Ce modèle se base sur la macro [`verifier_pt_sans_geom_lin`](/#!/macro/macro.test_otv.verifier_pt_sans_geom_lin).
      Il vérifie s'il existe des points de comptage qui ont des valeurs de trafic (indicateur TMJA) 
      mais qui n'ont pas de géométrie associée dans la table compteur.
      Ce modèle ne devrait idéalement contenir aucune ligne si tous les compteurs 
      avec des données de trafic ont bien une géométrie.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 0
            description: "Vérifier que le modèle ne contient aucune ligne - tous les compteurs avec des données TMJA doivent avoir une géométrie"
    columns:
      - name: id_comptag
        description: "Identifiant du compteur"
        data_tests:
          - not_null
          - unique
      - name: gestionnai
        description: "Gestionnaire de la route"
      - name: type_poste
        description: "Type de poste de comptage"
      - name: annee
        description: "Année de la donnée de comptage (la plus récente pour ce compteur)"
        data_tests:
          - not_null
      - name: periode
        description: "Période de comptage"
      - name: id
        description: "Identifiant interne de la donnée de comptage"
        data_tests:
          - not_null
      - name: id_comptag_uniq
        description: "Identifiant unique de de la table des indicateurs agrégés"
        data_tests:
          - not_null
      - name: indicateur
        description: "Type d'indicateur (toujours 'tmja' dans ce modèle)"
        data_tests:
          - accepted_values:
              arguments:
                values: ['tmja']
      - name: valeur
        description: "Valeur de l'indicateur TMJA"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                description: "Vérifier que la valeur TMJA est positive"
      - name: fichier
        description: "Fichier source de la donnée de comptage"

  - name: lin_verif_pt_linearise_absent_comptage_19
    description: >
      Ce modèle se base sur la macro [`verifier_pt_linearise_absent_comptage_lin`](/#!/macro/macro.test_otv.verifier_pt_linearise_absent_comptage_lin).
      Il vérifie s'il existe des points de comptage référencé dans la vue de base ['creer_vue_19'](/#!/model/model.test_otv.creer_vue_19)
      mais absent dans la table des comptages (schéma comptage).
      Ce modèle ne devrait idéalement contenir aucune ligne si tous les compteurs référencés sont bien présents dans la table des comptages.
      Si un compteur est absent, le modele teste s'il ets présent dans la table des compteurs associés (schema associe). Un test est réalisé pour vérifier
      qu'un comptage absent est forcément un comptage assoc. Si ce n'est pas le cas, il faut chercher pourquoi.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 0
            row_condition: "is_assoc = false"
            description: "Vérifier que le modèle ne contient aucune ligne qui n'est pas un comptage associé - tous les compteurs référencés sont présents dans le schéma comptage ou comptage assoc"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "CASE WHEN is_assoc  = true THEN id_cpteur_ref IS NOT NULL END"
            description: "Vérifier la cohérence is_assoc et id_cpteur_ref : si is_assoc=true alors id_cpteur_ref doit être renseigné"
    columns:
      - name: id_comptag
        description: "Identifiant du compteur"
        data_tests:
          - not_null
          - unique
      - name: is_assoc
        description: "Indique si le compteur est est un compteur associé ou non"
        data_tests:
          - not_null
      - name: id_cpteur_ref
        description: "Identifiant du compteur de référence (pour les compteurs associés)"

  - name: lin_verif_pt_emprise_dept_non_linearise_19
    description: >
      Ce modèle se base sur la macro [`verifier_pt_emprise_dept_non_linearise_lin`](/#!/macro/macro.test_otv.verifier_pt_emprise_dept_non_linearise_lin).
      Il vérifie s'il existe des points de comptage référencé dans la vue de base ['lin_update_pt_linearise_devenu_assoc_19'](/#!/model/model.test_otv.lin_update_pt_linearise_devenu_assoc_19)
      qui sont situés sur le territoire du département 19 (Corrèze) mais qui ne sont pas linéarisés.
      Ce modèle ne devrait idéalement contenir aucune ligne si tous les compteurs situés sur le département 19 sont pas linéarisés.
    columns:
      - name: id_comptag
        description: "Identifiant du compteur"
        data_tests:
          - not_null
          - unique

  - name: lin_verif_pt_attr_dept_non_linearise_19
    description: >
      Ce modèle se base sur la macro [`verifier_pt_attr_dept_non_linearise_lin`](/#!/macro/macro.test_otv.verifier_pt_attr_dept_non_linearise_lin).
      Il vérifie s'il existe des points de comptage non référencé dans la vue de base ['lin_update_pt_linearise_devenu_assoc_19'](/#!/model/model.test_otv.lin_update_pt_linearise_devenu_assoc_19)
      qui ont un attribut dept du département 19 (Corrèze).
      Ce modèle ne devrait idéalement contenir aucune ligne si tous les compteurs affecté au département 19 sont linéarisés.
    columns:
      - name: id_comptag
        description: "Identifiant du compteur"
        data_tests:
          - not_null
          - unique

  - name: lin_verif_pt_non_linearise_19
    description: >
      Ce modèle combine les résultats des modèles [`lin_verif_pt_emprise_dept_non_linearise_19`](/#!/model/model.test_otv.lin_verif_pt_emprise_dept_non_linearise_19)
      et [`lin_verif_pt_attr_dept_non_linearise_19`](/#!/model/model.test_otv.lin_verif_pt_attr_dept_non_linearise_19) pour fournir une liste complète
      des points de comptage situés dans le département 19 (Corrèze) qui ne sont pas linéarisés.
      Il est utile pour identifier tous les compteurs qui nécessitent une attention particulière en matière de linéarisation.
    columns:
      - name: id_comptag
        description: "Identifiant du compteur"
        data_tests:
          - not_null
          - unique