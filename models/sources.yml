          la table traf_2024
        columns:
          - name: id_comptag
            description: >
              Identifiant du compteur routier associé au tronçon de route, s'il y en a un.
              Permet de faire le lien entre la table des tronçons de route et la table des compteurs routiers.
      - name: traf2023_bdt_na_ed23_l
        description: >
          Table des tronçons de route mars ou septembre 2023 
          Attention, dans le cadre du test dbt, cette doc donne un exemlpe, mais en réalité il y a tout un traitement pour transformer le fichier IGN vers 
          la table traf_2023
        columns:
          - name: id_comptag
            description: >
              Identifiant du compteur routier associé au tronçon de route, s'il y en a un.
              Permet de faire le lien entre la table des tronçons de route et la table des compteurs routiers.
          
