  - name: traf
    description: > 
      Fichier de ligne BdTopo Thème transport 
    database: test_dbt  
    schema: lineaire  
    tables:
      - name: traf2024_bdt_na_ed24_l
        description: >
          Table des tronçons de route mars 2024 
          [troncon_de_route](https://data.geopf.fr/telechargement/download/BDTOPO/BDTOPO_3-3_TOUSTHEMES_GPKG_LAMB93_R75_2024-03-15/BDTOPO_3-3_TOUSTHEMES_GPKG_LAMB93_R75_2024-03-15.7z)
