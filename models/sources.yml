          Décrit les départements et communes de Nouvelle-Aquitaine uniquement

  - name: cptg
    description: >
      Ensemble des tables et vues décrivant les comptages routiers présents dans OTR.
      Contient les :
      - tables :
        - compteur, 
        - comptage, 
        - indic_agrege, 
      - vues :
        - 'vue_compteur_last_annee_know_tmja_pc_pl',
        - 'vue_evolutions_tmja'
      - table d'énumération :
        - enum_not_lin_why
    database: test_dbt
    schema: comptage
    tables:
      - name: compteur
        description: "Table des compteurs routiers, contient la géolocalisation"
      - name: comptage
        description: "Table des comptages réalisés sur les compteurs. 1 comptage par annéeet par compteur"
      - name: indic_agrege
        description: "Table des indicateurs agrégés issus des comptages, 1 ligne par comptage et indicateur"
      - name: vue_compteur_last_annee_know_tmja_pc_pl
        description: "Vue synthétique des compteurs avec la dernière année connue pour tmja, pc_pl"
      - name: vue_evolutions_tmja
        description: "Vue des évolutions annuelles du TMJA pour les compteurs ayant au moins 2 années de données"
      - name: enum_not_lin_why
        description: "Table d'énumération des raisons de non-linéarisation des comptages"

  - name: cptg_assoc
    description: >
      Ensemble des tables et vues décrivant les comptages associés à des comptages routiers de référence présents dans OTR.
      Contient les tables compteur, comptage, indic_agrege et la vue vue_assoc_compteur_last_annee_know_tmja_pc_pl.
    database: test_dbt
    schema: comptage_assoc
    tables:
      - name: compteur
        description: "Table des compteurs routiers, contient la géolocalisation"
        columns:
          - name: id_cpteur_asso
            description: "Identifiant du compteur associé"
          - name: id_cpteur_ref
            description: "Identifiant du compteur de référence auquel le compteur associé est lié"
      - name: comptage
        description: "Table des comptages réalisés sur les compteurs. 1 comptage par annéeet par compteur"
      - name: indic_agrege
        description: "Table des indicateurs agrégés issus des comptages, 1 ligne par comptage et indicateur"
      - name: vue_assoc_compteur_last_annee_know_tmja_pc_pl
        description: "Vue synthétique des compteurs avec la dernière année connue pour tmja, pc_pl"

