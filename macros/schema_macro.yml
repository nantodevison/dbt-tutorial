version: 2

macros:
  - name: create_vue_dept_annee
    description: >
      Crée une vue filtrée des données BDTopo routes pour un département 
      et une année (millésime) spécifique.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_gestionnaire_bdtopo_lin
    description: >
      Extrait la liste unique des gestionnaires présents dans la BDTopo 
      pour une année et un département donné.
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee'))"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: comparer_gestionnaire_bdtopo_lin
    description: >
      Compare les gestionnaires présents dans la BDTopo entre deux années 
      pour un département donné.
    arguments:
      - name: annee1
        type: integer
        description: "Première année de comparaison"
      - name: annee2
        type: integer
        description: "Deuxième année de comparaison"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_nbpt_lgkm_lin
    description: >
      Calcule le nombre de points de comptage et la longueur totale linéarisée 
      pour un département donné.
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee'))"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: verifier_nature_bdtopo_lin
    description: >
      Identifie les tronçons dont la nature est inattendue (sentier, chemin, route empierrée) 
      et calcule leur longueur cumulée.
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee'))"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_dept_limitrophe_lin
    description: >
      Retourne la liste des départements limitrophes au département spécifié, hors de la région NA.
      Cette liste est utilisée pour vérifier les comptages aux frontières départementales.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: verifier_comptage_limitrophe_lin
    description: >
      Extrait les données de comptage des départements limitrophes (hors NA) à partir de la vue 
      des derniers comptages connus (TMJA et %PL).
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_attr_modif_bdtopo_lin
    description: >
      Compare les attributs (importance, numero, obs_supl) des tronçons routiers d'un millésimes de la BDTopo avec le précédent
      là où des variation d'attribut ont été détectées (analyse de l'attribut attr_modif).
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_pt_sans_geom_lin
    description: >
      Identifie les points de comptage dans la table des compteurs qui n'ont pas de géométries mais ont des valeurs de trafic.
      Sert à contrôler la qualité des données de comptage avant l'affectation des lignes.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: verifier_pt_linearise_absent_comptage_lin
    description: >
      Identifie les référence à des comptages sur la table linéarisée qui n'ont sont absent de la table des compteurs et comptages.
      Sert à contrôler la qualité des données de comptage avant l'affectation des lignes.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: update_pt_linearise_devenu_assoc_lin
    description: >
      Met à jour les lignes BDTopo linéarisées qui étaient associées à des points de comptage qui sont devenu des comptages associés.
      Cette macro s'appuie sur le résultat de la vérification des points de comptage absents 
      (voir macro [verifier_pt_linearise_absent_comptage_lin](#verifier_pt_linearise_absent_comptage_lin)).
      Elle remplace l'id_comptag par l'id_cpteur_ref pour les lignes concernées, modifie obs_supl pour la traçabilité, s'assure que src_cpt = 'otv' et comen_cpt='linearisation' 
      tout en conservant toutes les autres valeurs originales du fichier de linéarisation.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: verifier_pt_emprise_dept_non_linearise_lin
    description: >
      Identifie les points de comptage situés dans le département donné qui ne sont pas encore linéarisés.
      Sert à contrôler la qualité des données de comptage avant l'affectation des lignes.
      S'appuie sur les sources `cptg.compteur`, `cptg.comptage`, `admi.dpt_bdt_na_ed~ (annee | string)[-2:] ~_s` 
      et la ref `lin_update_pt_linearise_devenu_assoc_{dept}`.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: cte_update_auto_pt_non_linearise_lin__project_cpt
    description: >
      Identifie les tronçons BdTopo candidats pour la linéarisation automatique des points de comptage non linéarisés.
      Effectue une recherche spatiale (distance < 50m) et calcule un score de similarité textuelle 
      entre le nom de route du compteur et le numéro/nom du tronçon.
      S'appuie sur les modèles [`lin_verif_pt_non_linearise_{dept}`](/#!/models/models.test_otv.lin_verif_pt_non_linearise_{dept}) et
      et [`lin_update_pt_linearise_devenu_assoc_{dept}`](/#!/models/models.test_otv.lin_update_pt_linearise_devenu_assoc_{dept}).
      Utilise aussi la source `cptg.compteur` 
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"  

  - name: cte_update_auto_pt_non_linearise_lin__rang
    description: >
      Classe les tronçons candidats issus de la macro [cte_update_auto_pt_non_linearise_lin__project_cpt](/#!/models/models.test_otv.cte_update_auto_pt_non_linearise_lin__project_cpt) 
      pour chaque compteur selon une logique différentielle :
      entrée/sortie sur bretelles (distance), autres compteurs (similarité puis distance).
      Macro qui imbrique cte_update_auto_pt_non_linearise_lin__project_cpt 
      pour éviter les cycles de dépendances.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"   

  - name: cte_update_auto_pt_non_linearise_lin__choix_cpt_tronc
    description: >
      Sélectionne le meilleur tronçon candidat (rang 1) pour chaque compteur non linéarisé,
      issus de la macro [cte_update_auto_pt_non_linearise_lin__rang](/#!/models/models.test_otv.cte_update_auto_pt_non_linearise_lin__rang).
      Utilise DISTINCT ON pour ne garder qu'une seule proposition par compteur.
      Macro finale du processus de matching automatique (imbrique cte_update_auto_pt_non_linearise_lin__rang).
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: update_auto_pt_non_linearise_lin
    description: >
      Pipeline complet de linéarisation automatique des points de comptage non linéarisés.
      Utilise la macro [cte_update_auto_pt_non_linearise_lin__choix_cpt_tronc](/#!/models/models.test_otv.cte_update_auto_pt_non_linearise_lin__choix_cpt_tronc)
      et la joint aux données issues du modèle [`lin_update_pt_linearise_devenu_assoc_{dept}`](/#!/models/models.test_otv.lin_update_pt_linearise_devenu_assoc_{dept}).
      pour proposer des associations compteur-tronçon basées sur la proximité spatiale et la similarité textuelle, et compléter avec les lignes non concernées.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_pt_attr_dept_non_linearise_lin
    description: >
      Identifie les points de comptage avec un attribut dept correspondant au département à linéarisé, mais qui ne le sont pas.
      Sert à contrôler la qualité des données de comptage avant l'affectation des lignes.
      S'appuie sur les sources `cptg.compteur`, `cptg.vue_compteur_last_annee_know_tmja_pc_pl`
      et la ref `lin_update_pt_linearise_devenu_assoc_{dept}`.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: update_nouveau_point_lin
    description: >
      Met à jour les des lignes BDTopo à partir d'un relevé manuel compris dans le fichier de seed (`deptXX_update_nouveau_pt`).
      Ne concerne que les lignes affectées à de nouveaux points de comptage (`id_comptag` non présent dans le millésime précédent).
      Permet l'affectation soit par `id_ign` (identifiant BdTopo) soit par `id_simpli` (identifiant interne OTR).
      Cette macro permet de prioriser les colonnes fournit manuellement dans le fichier de
      seed pour les lignes à réaffecter. Les lignes non présentes dans le seed conservent
      leurs valeurs originales de la BDTopo. `src_cpt` et `coment_cpt` sont forcés à 'otv' et 'linearisation'.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: update_modif_linearisation_lin
    description: >
      Met à jour la linéarisation des lignes BDTopo à partir de choix manuels compris dans le fichier de seed (deptXX_update_modif_linearisation).
      Concerne uniquement les modifications de linéarisation pour des points de comptage existants (id_comptag déjà présent dans le millésime précédent).
      s'appuie sur le résultat de la prise en compte des nouveaux points de comptage (voir macro [update_nouveau_point_lin](#update_nouveau_point_lin)).
      Cette macro modifie uniquement les identifiants de comptage (id_comptag) pour les lignes spécifiées dans le seed,
      tout en conservant toutes les autres valeurs originales du fichier de linearisation. Les lignes non présentes dans le seed
      conservent leurs attributs originaux.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: update_oubli_erreur_lin
    description: >
      Corrige les oublis de linéarisation des lignes BDTopo à partir de choix manuels compris dans le fichier de seed (deptXX_update_oubli_erreur_linearisation).
      Concerne uniquement la correction d'oublis pour des points de comptage existants : rattachement de lignes BdTopo qui auraient dû être incluses 
      dès la linéarisation initiale mais qui ont été omises. S'appuie sur le résultat de la modification de linéarisation 
      (voir macro [update_modif_linearisation_lin](#update_modif_linearisation_lin)).
      Cette macro ajoute les lignes oubliées en les rattachant au bon id_comptag, avec des valeurs standardisées :
      src_cpt='otv', coment_cpt='linearisation', obs_supl=null, obs_tmja=null, obs_pc_pl=null.
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: update_etirer_lin
    description: >
      Étire la linéarisation des lignes BDTopo à partir de choix manuels compris dans le fichier de seed (deptXX_update_etire_linearisation).
      Concerne l'extension de la linéarisation d'un point de comptage existant en y rattachant des lignes BdTopo supplémentaires (étirement de la zone couverte).
      S'appuie sur le résultat de la correction d'oublis de linéarisation 
      (voir macro [update_oubli_erreur_lin](#update_oubli_erreur_lin)).
      Cette macro ajoute les lignes supplémentaires en les rattachant au bon id_comptag, avec des valeurs standardisées :
      src_cpt='otv', coment_cpt='linearisation', obs_supl='linearisation etiree traf{annee}', obs_tmja=null, obs_pc_pl=null.
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: update_vers_estimation_lin
    description: >
      Fait basculer des lignes BDTopo linéarisées vers un statut d'estimation à partir de choix manuels compris dans le fichier de seed (deptXX_update_vers_estimation_linearisation).
      S'appuie sur le résultat de l'étirement de linéarisation 
      (voir macro [update_etirer_lin](#update_etirer_lin)).
      Cette macro transforme les lignes spécifiées en supprimant les références de comptage (id_comptag=null, src_cpt=null) 
      et en passant en mode estimation (coment_cpt='estimation', obs_tmja='auto', obs_pc_pl='auto').
      L'historique de transformation est conservé dans obs_supl avec l'ancien id_comptag et l'année précédente.
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: verifier_stats_linearisation_pt_comptage_lin
    description: >
      Calcule les statistiques des nouveaux points de comptage linéarisés pour une année donnée :
      nombre de compteurs distincts et kilométrage total concerné.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime"
      - name: dept  
        type: string
        description: "Code département"

  - name: verifier_not_lin_why_lin
    description: >
      Identifie les lignes BdTopo avec des statuts contradictoires : affectées à des comptage,
      mais ces comptages sont marqués comme "non linéarisables" 
      (not_lin_why IS NOT NULL) dans la table comptage.
      Permet de détecter les incohérences entre les données métier de comptage et les traitements 
      automatiques de linéarisation. Retourne tous les attributs de la table comptage pour faciliter 
      l'analyse des cas problématiques et identifier les causes des contradictions.
      S'appuie sur la source [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) et le modèle 
      [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.lin_update_vers_estimation_19).
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_cptg_not_lin_why_geom_dept_lin
    description: >
      Identifie les compteurs géographiquement situés dans l'emprise du département 
      qui ont un motif de non-linéarisation renseigné (not_lin_why IS NOT NULL).
      Utilise l'aire géographique
      du département via la source [`aire.dpt_bdt_na_ed{annee}_s`](/#!/source/source.test_otv.aire.dpt_bdt_na_ed24_s).
      Effectue ensuite une jointure avec la table [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) 
      pour récupérer les informations de comptage. Permet un contrôle exhaustif géographique
      des compteurs "problématiques" dans l'emprise territoriale, indépendamment de leur présence
      dans les modèles de linéarisation. Retourne les informations essentielles : identifiant compteur,
      année de mise en place et période de comptage.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY pour construire le nom de la table aire (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères pour filtrer l'emprise géographique (par défaut: variable projet 'dept')"

  - name: verifier_tmjo_lin
    description: >
      Identifie les compteurs linéarisés par OTV qui disposent de données TMJO (Trafic Moyen Journalier Ouvrable).
      Utilise une jointure entre les sources [`cptg.indic_agrege`](/#!/source/source.test_otv.cptg.indic_agrege),
      [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) et [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      avec le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.lin_update_vers_estimation_19).
      Applique un DISTINCT ON pour ne retourner qu'un seul résultat par compteur (le plus récent).
      Retourne les informations essentielles : identifiant compteur, année de comptage, gestionnaire.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_tmjo_tmja_lin
    description: >
      Vérifie que les compteurs linéarisés par OTV qui disposent de données TMJO ont aussi du TMJA.
      Utilise une jointure entre les sources [`cptg.indic_agrege`](/#!/source/source.test_otv.cptg.indic_agrege),
      [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage), [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      et le modèle [`lin_verif_tmjo_{dept}`](/#!/model/model.test_otv.lin_verif_tmjo_19).
      Applique un DISTINCT ON pour ne retourner qu'un seul résultat par compteur (le plus récent).
      Retourne les informations complètes de l'indicateur TMJA : identifiant, valeur, fichier source.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_ann_pt_2020_lin
    description: >
      Identifie les compteurs linéarisés ayant une année de mise en place (ann_pt) égale à 2020.
      Pour rappel, cette année COVID est considérée comme non représentative pour les analyses de trafic.
      Utilise le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.lin_update_vers_estimation_19)
      comme source de données après traitement de linéarisation.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_cpt_mm_section_homo_lin__cpt_proche
    description: >
      Identifie le tronçon BDTopo le plus proche de chaque compteur linéarisé par OTV
      dans un rayon de distance configurable (par défaut 100 mètres).
      Utilise une jointure spatiale entre la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      et le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.lin_update_vers_estimation_19)
      Retourne l'identifiant du compteur et l'identifiant IGN du tronçon BDTopo associé.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: distance
        type: integer
        description: "Distance maximale de recherche en mètres (par défaut: 100)"

  - name: cte_verif_cpt_mm_section_homo_lin__lineaire_tot
    description: >
      Ajoute un attribut `id_cpt_proche` (TRUE/FALSE) à la linéarisation indiquant si une ligne peut etre affectée à un
      compteur.
      Utilise la CTE [`cte_verif_cpt_mm_section_homo_lin__cpt_proche`](/#!/macro/macro.test_otv.cte_verif_cpt_mm_section_homo_lin__cpt_proche)
      pour identifier les tronçons les plus proches de chaque compteur dans un rayon configurable (par défaut 100 mètres).
      Filtre uniquement les tronçons ayant un compteur affecté (id_comptag IS NOT NULL).
      Retourne toutes les colonnes du modèle de linéarisation plus l'indicateur de proximité.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: distance
        type: integer
        description: "Distance maximale de recherche en mètres pour considérer un compteur comme 'proche' (par défaut: 100)"

  - name: verifier_cpt_mm_section_homo_lin
    description: >
      Identifie les sections homogènes (id_simpli) qui partagent plusieurs compteurs.
      Utilise le modèle [`lin_cte_verif_cpt_mm_section_homo_{dept}__lineaire_tot`](/#!/model/model.test_otv.lin_cte_verif_cpt_mm_section_homo_19__lineaire_tot).
      Retourne les informations de tronçons concernés : id_ign, id_simpli et id_comptag,
      triées par id_simpli pour faciliter l'analyse groupée.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_nb_cpt_ann_n_lin
    description: >
      Connaitre le nombre de compteurs linéarisés
      qui disposent de données de comptage pour l'année spécifiée.
      Peut etre utilisée pour connaitre le nombre de compteurs suspects de l'année considérée.
      Utilise le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.lin_update_vers_estimation_19)
      comme source des compteurs linéarisés et la source [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage)
      filtrée sur l'année spécifiée pour vérifier la disponibilité des données de comptage.
      Retourne un COUNT(*) représentant le nombre de compteurs linéarisés disposant effectivement 
      de données de comptage pour l'année concernée.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année des comptages à vérifier au format YYYY (par défaut: variable projet 'annee')"
      - name: suspect
        type: boolean
        description: "Indicateur pour filtrer uniquement les compteurs suspects (TRUE) ou tous les compteurs (FALSE) (par défaut: FALSE)"

  - name: verifier_nb_tronc_linearise_lin
    description: >
      Compte le nombre de tronçons linéarisés selon deux métriques complémentaires.
      Utilise le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.lin_update_vers_estimation_19)
      comme source des tronçons linéarisés. Effectue deux comptages avec filtres :
      1) nb_cpt_lin_id_cptg : nombre de tronçons ayant un compteur affecté (id_comptag IS NOT NULL).
      2) nb_cpt_lin_otv : nombre de tronçons de source OTV (src_cpt='otv').
      Ces deux métriques peuvent différer si certains tronçons ont src_cpt='otv' mais pas encore d'id_comptag affecté,
      ou si des compteurs ont été affectés à des tronçons provenant d'autres sources.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: update_indic_trafic_lin
    description: >
      Met à jour les indicateurs de trafic (TMJA, %PL, années) pour les tronçons qui référence des compteurs,
      en utilisant les dernières données de comptage disponibles.
      S'appuie sur le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.lin_update_vers_estimation_19)
      et la source [`cptg.vue_compteur_last_annee_know_tmja_pc_pl`](/#!/source/source.test_otv.cptg.vue_compteur_last_annee_know_tmja_pc_pl).
      Effectue un processus en trois étapes via une CTE `reset_indic` et deux UNION :
      1) Réinitialise à NULL les indicateurs de trafic (tmja, pc_pl, ann_pt, ann_pc_pl, pl, veh_km, tmja_final, pl_final, pl_km, obs_tmja, obs_pc_pl)
      pour tous les tronçons OTV (src_cpt='otv').
      2) Met à jour ces indicateurs avec les dernières données de comptage disponibles
      Force coment_cpt='linearisation', obs_tmja=NULL, obs_pc_pl='auto' si %PL manquant.
      3) Conserve les valeurs originales pour tous les autres tronçons (src_cpt != 'otv' ou NULL)
      et les tronçons OTV sans données de comptage disponibles.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_historique_trafic_lin
    description: >
      Fournit le valeurs de `tmja`, `pc_pl`, `obs`, `periode` et `src` pour tout les compteurs.
      Un attribut par année ('wide form').
      Basé sur les sources 
      - [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      - [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage)
      - [`cptg.indic_agrege`](/#!/source/source.test_otv.cptg.indic_agrege).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_suspect_indic_lin
    description: >
      Identifie les compteurs linéarisés dont les données de trafic proviennent d'années marquées comme suspectes
      dans la table des comptages, puis fournit l'historique des tmja (ou tmjo), pc_pl, obs, periode et src pour ces compteurs.
      Basé sur le modèle [`lin_update_indic_trafic_{dept}`](/#!/model/model.test_otv.lin_update_indic_trafic_19)
      ,la source [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) et la cte 
      [cte_verif_historique_trafic_lin](/#!/macro/macro.test_otv.cte_verif_historique_trafic_lin).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_cpt_hors_dept_dans_na_lin__list_cpt
    description: >
      Identifie les compteurs référencés dans la linéarisation d'un département dont l'identifiant (id_comptag) 
      indique une appartenance à un autre département de la région Nouvelle-Aquitaine.
      Effectue une analyse textuelle de l'id_comptag (extraction des 2 premiers caractères via split_part)
      et compare avec la liste des départements NA (variable 'dept_na').
      Utilise le modèle [`lin_update_indic_trafic_{dept}`](/#!/model/model.test_otv.lin_update_indic_trafic_19)
      après mise à jour des indicateurs de trafic et joint avec la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      pour récupérer le type de poste. 
      Première étape pour la mise à jour des indicateurs de trafic pour ces compteurs,
      dont certaines valeurs peuvent ne pas être disponibles (en fonction du cycle d'import de chaque département).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères pour lequel on effectue la vérification (par défaut: variable projet 'dept')"

  - name: cte_verif_cpt_hors_dept_dans_na_lin__auto
    description: >
      Associe les données de trafic de l'année du millésime concerné (si disponibles)
      aux compteurs issus de la macro [`cte_verif_cpt_hors_dept_dans_na_lin__list_cpt`](/#!/macro/macro.test_otv.cte_verif_cpt_hors_dept_dans_na_lin__list_cpt)
      . Objectif : mise à jour auto des compteurs hors dept mais dans NA.
      Possible doublon avec des processus précédents.
      Permet de vérifier la disponibilité des données de comptage pour les compteurs d'autres départements NA
    arguments:
      - name: annee
        type: integer
        description: "Année des données de trafic à récupérer au format YYYY (par défaut: variable projet 'annee')"

  - name: update_cpt_hors_dept_dans_na_lin
    description: >
      Met à jour les indicateurs de trafic des tronçons linéarisés qui référencent des compteurs hors département (mais dans NA)
      en intégrant trois sources de données 
      par ordre de priorité : 1) mise à jour automatique des compteurs hors département NA, 
      2) mise à jour manuelle via seed, 3) conservation des valeurs existantes.
      Utilise le modèle [`lin_update_indic_trafic_{dept}`](/#!/model/model.test_otv.lin_update_indic_trafic_19)
      comme base,  Met à jour les compteurs d'autres départements NA ayant des données disponibles
      pour l'année spécifiée via la CTE [`cte_verif_cpt_hors_dept_dans_na_lin__auto`](/#!/macro/macro.test_otv.cte_verif_cpt_hors_dept_dans_na_lin__auto).
      Remplace ann_pt, tmja, pc_pl et pl par les dernières valeurs disponibles, conserve le reste.
      Applique les corrections manuelles issues du seed 
      [`dept{dept}_update_cpt_existant_mano`](/#!/seed/seed.test_otv.dept19_update_cpt_existant_mano).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY pour forcer ann_pt dans les mises à jour manuelles (par défaut: variable projet 'annee')"
  
  - name: verifier_stats_linearisation_nbpt_lgkm_annee
    description: >
      Calcule les statistiques de linéarisation par année de mise en place des compteurs (ann_pt) :
      nombre de points de comptage distincts et kilométrage total linéarisé.
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_19)
      comme source finale après les mises à jour d'indicateurs de trafic (tmja et pc_pl).
      Filtre uniquement les tronçons linéarisés (src_cpt='otv') pour exclure les estimations.
      Premier modele de verif post-update des tmja et pc_pl
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_stats_linearisation_nbpt_gest
    description: >
      Calcule les statistiques de linéarisation par gestionnnaire :
      nombre de points de comptage distincts.
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_{dept})
      comme source finale après les mises à jour d'indicateurs de trafic (tmja et pc_pl).
      Filtre uniquement les tronçons linéarisés (src_cpt='otv') pour exclure les estimations.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: boolean
        description: "drapeau pour permettre ensuite l'agrégation par année (TRUE) ou non (FALSE) (par défaut: FALSE)"

  - name: verifier_stats_linearisations_gest_annees
    description: >
      Calcule les statistiques de linéarisation par gestionnaire et par année de comptage (ann_pt) :
      nombre de points de comptage distincts.
      Utilise la macro [`verifier_stats_linearisation_nbpt_gest`](/#!/macro/macro.test_otv.verifier_stats_linearisation_nbpt_gest)
      comme base.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_coherence_cpt_std_lin__cpt_lin
    description: >
      CTE qui extrait les informations géométriques et techniques des compteurs qui ont été linéarisés.
      Effectue une jointure INNER entre la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      et le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_19)
      pour ne retenir que les compteurs référencés dans la linéarisation.
      Retourne les informations essentielles du compteur : identifiant, type de poste, sens de comptage,
      et géométrie ponctuelle. Utilisée comme CTE intermédiaire dans les vérifications de cohérence
      entre les données de comptage source et les données linéarisées.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_coherence_comptag_standardisation_vs_linearisation_lin
    description: >
      Identifie les incohérences entre les compteurs linéarisés et les compteurs standardisés en détectant
      les cas où l'identifiant du compteur linéarisé est différent du plus proche compteur standardisé.
      Utilise la macro [`cte_verif_coherence_cpt_std_lin__cpt_lin`](/#!/macro/macro.test_otv.cte_verif_coherence_cpt_std_lin__cpt_lin).
      Pour chaque compteur linéarisé, retourne le compteur standardisé le plus proche ayant un identifiant différent,
      ainsi que la distance les séparant et la géométrie.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: dist
        type: integer
        description: "Distance maximale de recherche en mètres pour identifier un compteur standardisé proche (par défaut: 10)"