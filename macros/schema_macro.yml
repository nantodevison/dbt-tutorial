version: 2

macros:
  - name: mcr_ajouter_troncon_nouveau_millesime
    description: >
      Génère les lignes BDTopo à ajouter au fichier de linéarisation suite à des ajout manuel lors du changement de millésime ou du 
      process de linéarisation.
      Pour chaque tronçon référencé dans le seed `ad_suppr_row_new_millesime` avec `type_modif='ad'`,
      la macro vérifie d'abord si l'id_ign est absent de la couche BDTopo du millésime courant (CTE `ad`),
      puis récupère ses attributs géométriques et métier (trafic, indicateurs, VTS, etc.) via une double
      jointure : la géométrie du millésime N (`troncon_route_bdt_na_ed{annee_sfx}_l`) et les attributs
      métier de l'année N (`traf{annee}_bdt_na_ed{annee_sfx}_l`) via la colonne `id_propa`.
      Les indicateurs dérivés (`tmja_final`, `veh_km`, `pl_final`, `pl_km`) sont recalculés en fonction
      du sens de circulation (double sens / sens unique).
    arguments:
      - name: annee
        type: int
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: creer_vue_dept_annee
    description: >
      Génère la vue des tronçons BDTopo routes pour un département et une année (millésime) spécifique,
      en intégrant les corrections liées aux changements de millésime.
      Effectue deux opérations combinées par UNION :

      1. **Suppression** : sélectionne les tronçons de la source
      `traf.traf{annee}_bdt_na_ed{annee_sfx}_l` filtrés sur le département,
      en excluant via `NOT EXISTS` les `id_ign` référencés dans le seed
      [`ad_suppr_row_new_millesime`](/#!/seed/seed.test_otv.ad_suppr_row_new_millesime)
      avec `type_modif='sup'` (tronçons disparus du nouveau millésime à retirer).

      2. **Ajout** : complète par UNION avec le modèle
      [`mdl_ad_troncons_new_millesime`](/#!/model/model.test_otv.mdl_ad_troncons_new_millesime),
      qui reconstruit les tronçons référencés dans le seed avec `type_modif='ad'`
      (tronçons absents du nouveau millésime mais à conserver via propagation depuis l'année N-1).
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_gestionnaire_bdtopo_lin
    description: >
      Extrait la liste unique des gestionnaires présents dans la BDTopo 
      pour une année et un département donné.
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee'))"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: comparer_gestionnaire_bdtopo_lin
    description: >
      Compare les gestionnaires présents dans la BDTopo entre deux années 
      pour un département donné.
    arguments:
      - name: annee1
        type: integer
        description: "Première année de comparaison"
      - name: annee2
        type: integer
        description: "Deuxième année de comparaison"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_nbpt_lgkm_lin
    description: >
      Calcule le nombre de points de comptage et la longueur totale linéarisée 
      pour un département donné.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: verifier_nature_bdtopo_lin
    description: >
      Identifie les tronçons dont la nature est inattendue (sentier, chemin, route empierrée) 
      et calcule leur longueur cumulée.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_dept_limitrophe_lin
    description: >
      Retourne la liste des départements limitrophes au département spécifié, hors de la région NA.
      Cette liste est utilisée pour vérifier les comptages aux frontières départementales.
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee'))"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: verifier_comptage_limitrophe_lin
    description: >
      Extrait les données de comptage des départements limitrophes (hors NA) à partir de la vue 
      des derniers comptages connus (TMJA et %PL).
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_attr_modif_bdtopo_lin
    description: >
      Compare les attributs (importance, numero, obs_supl) des tronçons routiers d'un millésimes de la BDTopo avec le précédent
      là où des variation d'attribut ont été détectées (analyse de l'attribut attr_modif).
    arguments:
      - name: annee
        type: integer
        description: "Année des données (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_pt_sans_geom_lin
    description: >
      Identifie les points de comptage dans la table des compteurs qui n'ont pas de géométries mais ont des valeurs de trafic.
      Sert à contrôler la qualité des données de comptage avant l'affectation des lignes.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: verifier_pt_linearise_absent_comptage_lin
    description: >
      Identifie les référence à des comptages sur la table linéarisée qui n'ont sont absent de la table des compteurs et comptages.
      Sert à contrôler la qualité des données de comptage avant l'affectation des lignes.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: update_pt_linearise_devenu_assoc_lin
    description: >
      Met à jour les lignes BDTopo linéarisées qui étaient associées à des points de comptage qui sont devenu des comptages associés.
      Cette macro s'appuie sur le résultat de la vérification des points de comptage absents 
      (voir macro [verifier_pt_linearise_absent_comptage_lin](#verifier_pt_linearise_absent_comptage_lin)).
      Elle remplace l'id_comptag par l'id_cpteur_ref pour les lignes concernées, modifie obs_supl pour la traçabilité, s'assure que src_cpt = 'otv' et comen_cpt='linearisation' 
      tout en conservant toutes les autres valeurs originales du fichier de linéarisation.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_pt_emprise_dept_non_linearise_lin
    description: >
      Identifie les points de comptage situés dans le département donné qui ne sont pas encore linéarisés.
      Sert à contrôler la qualité des données de comptage avant l'affectation des lignes.
      S'appuie sur les sources `cptg.compteur`, `cptg.comptage`, `admi.dpt_bdt_na_ed~ (annee | string)[-2:] ~_s` 
      et la ref `lin_update_pt_linearise_devenu_assoc_{dept}`.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_update_auto_pt_non_linearise_lin__project_cpt
    description: >
      Identifie les tronçons BdTopo candidats pour la linéarisation automatique des points de comptage non linéarisés.
      Effectue une recherche spatiale (distance < 50m) et calcule un score de similarité textuelle 
      entre le nom de route du compteur et le numéro/nom du tronçon.
      S'appuie sur les modèles [`lin_verif_pt_non_linearise_{dept}`](/#!/models/models.test_otv.lin_verif_pt_non_linearise_{dept}) et
      et [`lin_update_pt_linearise_devenu_assoc_{dept}`](/#!/models/models.test_otv.lin_update_pt_linearise_devenu_assoc_{dept}).
      Utilise aussi la source `cptg.compteur` 
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"  

  - name: cte_update_auto_pt_non_linearise_lin__rang
    description: >
      Classe les tronçons candidats issus de la macro [cte_update_auto_pt_non_linearise_lin__project_cpt](/#!/models/models.test_otv.cte_update_auto_pt_non_linearise_lin__project_cpt) 
      pour chaque compteur selon une logique différentielle :
      entrée/sortie sur bretelles (distance), autres compteurs (similarité puis distance).
      Macro qui imbrique cte_update_auto_pt_non_linearise_lin__project_cpt 
      pour éviter les cycles de dépendances.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"   

  - name: cte_update_auto_pt_non_linearise_lin__choix_cpt_tronc
    description: >
      Sélectionne le meilleur tronçon candidat (rang 1) pour chaque compteur non linéarisé,
      issus de la macro [cte_update_auto_pt_non_linearise_lin__rang](/#!/models/models.test_otv.cte_update_auto_pt_non_linearise_lin__rang).
      Utilise DISTINCT ON pour ne garder qu'une seule proposition par compteur.
      Macro finale du processus de matching automatique (imbrique cte_update_auto_pt_non_linearise_lin__rang).
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: update_auto_pt_non_linearise_lin
    description: >
      Pipeline complet de linéarisation automatique des points de comptage non linéarisés.
      Utilise la macro [cte_update_auto_pt_non_linearise_lin__choix_cpt_tronc](/#!/models/models.test_otv.cte_update_auto_pt_non_linearise_lin__choix_cpt_tronc)
      et la joint aux données issues du modèle [`lin_update_pt_linearise_devenu_assoc_{dept}`](/#!/models/models.test_otv.lin_update_pt_linearise_devenu_assoc_{dept}).
      pour proposer des associations compteur-tronçon basées sur la proximité spatiale et la similarité textuelle, et compléter avec les lignes non concernées.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: sim_seuil_bas
        type: float
        description: "Seuil bas de similarité textuelle pour le matching (par défaut: 0.2)"
      - name: dist_seuil_haut
        type: integer
        description: "Seuil haut de distance (en mètres) pour le matching (par défaut: 20)"

  - name: verifier_pt_attr_dept_non_linearise_lin
    description: >
      Identifie les points de comptage avec un attribut dept correspondant au département à linéarisé, mais qui ne le sont pas.
      Sert à contrôler la qualité des données de comptage avant l'affectation des lignes.
      S'appuie sur les sources `cptg.compteur`, `cptg.vue_compteur_last_annee_know_tmja_pc_pl`
      et la ref `lin_update_pt_linearise_devenu_assoc_{dept}`.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept'))"

  - name: update_nouveau_point_lin
    description: >
      Met à jour les des lignes BDTopo à partir d'un relevé manuel compris dans le fichier de seed (`deptXX_update_nouveau_pt`).
      Ne concerne que les lignes affectées à de nouveaux points de comptage (`id_comptag` non présent dans le millésime précédent).
      Permet l'affectation soit par `id_ign` (identifiant BdTopo) soit par `id_simpli` (identifiant interne OTR).
      Cette macro permet de prioriser les colonnes fournit manuellement dans le fichier de
      seed pour les lignes à réaffecter. Les lignes non présentes dans le seed conservent
      leurs valeurs originales de la BDTopo. `src_cpt` et `coment_cpt` sont forcés à 'otv' et 'linearisation'.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: update_modif_linearisation_lin
    description: >
      Met à jour la linéarisation des lignes BDTopo à partir de choix manuels compris dans le fichier de seed (deptXX_update_modif_linearisation).
      Concerne uniquement les modifications de linéarisation pour des points de comptage existants (id_comptag déjà présent dans le millésime précédent).
      s'appuie sur le résultat de la prise en compte des nouveaux points de comptage (voir macro [update_nouveau_point_lin](#update_nouveau_point_lin)).
      Cette macro modifie uniquement les identifiants de comptage (id_comptag) pour les lignes spécifiées dans le seed,
      tout en conservant toutes les autres valeurs originales du fichier de linearisation. Les lignes non présentes dans le seed
      conservent leurs attributs originaux.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: update_oubli_erreur_lin
    description: >
      Corrige les oublis de linéarisation des lignes BDTopo à partir de choix manuels compris dans le fichier de seed (deptXX_update_oubli_erreur_linearisation).
      Concerne uniquement la correction d'oublis pour des points de comptage existants : rattachement de lignes BdTopo qui auraient dû être incluses 
      dès la linéarisation initiale mais qui ont été omises. S'appuie sur le résultat de la modification de linéarisation 
      (voir macro [update_modif_linearisation_lin](#update_modif_linearisation_lin)).
      Cette macro ajoute les lignes oubliées en les rattachant au bon id_comptag, avec des valeurs standardisées :
      src_cpt='otv', coment_cpt='linearisation', obs_supl=null, obs_tmja=null, obs_pc_pl=null.
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: update_etirer_lin
    description: >
      Étire la linéarisation des lignes BDTopo à partir de choix manuels compris dans le fichier de seed (deptXX_update_etire_linearisation).
      Concerne l'extension de la linéarisation d'un point de comptage existant en y rattachant des lignes BdTopo supplémentaires (étirement de la zone couverte).
      S'appuie sur le résultat de la correction d'oublis de linéarisation 
      (voir macro [update_oubli_erreur_lin](#update_oubli_erreur_lin)).
      Cette macro ajoute les lignes supplémentaires en les rattachant au bon id_comptag, avec des valeurs standardisées :
      src_cpt='otv', coment_cpt='linearisation', obs_supl='linearisation etiree traf{annee}', obs_tmja=null, obs_pc_pl=null.
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: update_vers_estimation_lin
    description: >
      Fait basculer des lignes BDTopo linéarisées vers un statut d'estimation à partir de choix manuels compris dans le fichier de seed (deptXX_update_vers_estimation_linearisation).
      S'appuie sur le résultat de l'étirement de linéarisation 
      (voir macro [update_etirer_lin](#update_etirer_lin)).
      Cette macro transforme les lignes spécifiées en supprimant les références de comptage (id_comptag=null, src_cpt=null) 
      et en passant en mode estimation (coment_cpt='estimation', obs_tmja='auto', obs_pc_pl='auto').
      L'historique de transformation est conservé dans obs_supl avec l'ancien id_comptag et l'année précédente.
      Les lignes non présentes dans le seed conservent leurs attributs originaux.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: verifier_stats_linearisation_pt_comptage_lin
    description: >
      Calcule les statistiques des nouveaux points de comptage linéarisés pour une année donnée :
      nombre de compteurs distincts et kilométrage total concerné.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime"
      - name: dept  
        type: string
        description: "Code département"

  - name: verifier_not_lin_why_lin
    description: >
      Identifie les lignes BdTopo avec des statuts contradictoires : affectées à des comptage,
      mais ces comptages sont marqués comme "non linéarisables" 
      (not_lin_why IS NOT NULL) dans la table comptage.
      Permet de détecter les incohérences entre les données métier de comptage et les traitements 
      automatiques de linéarisation. Retourne tous les attributs de la table comptage pour faciliter 
      l'analyse des cas problématiques et identifier les causes des contradictions.
      S'appuie sur la source [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) et le modèle 
      [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.mdl11_lin_upd_vers_estim_19).
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_cptg_not_lin_why_geom_dept_lin
    description: >
      Identifie les compteurs géographiquement situés dans l'emprise du département 
      qui ont un motif de non-linéarisation renseigné (not_lin_why IS NOT NULL).
      Utilise l'aire géographique
      du département via la source [`aire.dpt_bdt_na_ed{annee}_s`](/#!/source/source.test_otv.aire.dpt_bdt_na_ed24_s).
      Effectue ensuite une jointure avec la table [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) 
      pour récupérer les informations de comptage. Permet un contrôle exhaustif géographique
      des compteurs "problématiques" dans l'emprise territoriale, indépendamment de leur présence
      dans les modèles de linéarisation. Retourne les informations essentielles : identifiant compteur,
      année de mise en place et période de comptage.
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY pour construire le nom de la table aire (par défaut: variable projet 'annee')"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères pour filtrer l'emprise géographique (par défaut: variable projet 'dept')"

  - name: verifier_tmjo_lin
    description: >
      Identifie les compteurs linéarisés par OTV qui disposent de données TMJO (Trafic Moyen Journalier Ouvrable).
      Utilise une jointure entre les sources [`cptg.indic_agrege`](/#!/source/source.test_otv.cptg.indic_agrege),
      [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) et [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      avec le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.mdl11_lin_upd_vers_estim_19).
      Applique un DISTINCT ON pour ne retourner qu'un seul résultat par compteur (le plus récent).
      Retourne les informations essentielles : identifiant compteur, année de comptage, gestionnaire.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_tmjo_exists_tmja_lin
    description: >
      Vérifie que les compteurs linéarisés par OTV qui disposent de données TMJO ont aussi du TMJA.
      Utilise une jointure entre les sources [`cptg.indic_agrege`](/#!/source/source.test_otv.cptg.indic_agrege),
      [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage), [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      et le modèle [`lin_verif_tmjo_{dept}`](/#!/model/model.test_otv.mdl12h_lin_chk_tmjo_19).
      Applique un DISTINCT ON pour ne retourner qu'un seul résultat par compteur (le plus récent).
      Retourne les informations complètes de l'indicateur TMJA : identifiant, valeur, fichier source.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_ann_pt_2020_lin
    description: >
      Identifie les compteurs linéarisés ayant une année de mise en place (ann_pt) égale à 2020.
      Pour rappel, cette année COVID est considérée comme non représentative pour les analyses de trafic.
      Utilise le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.mdl11_lin_upd_vers_estim_19)
      comme source de données après traitement de linéarisation.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_cpt_mm_section_homo_lin__cpt_proche
    description: >
      Identifie le tronçon BDTopo le plus proche de chaque compteur linéarisé par OTV
      dans un rayon de distance configurable (par défaut 100 mètres).
      Utilise une jointure spatiale entre la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      et le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.mdl11_lin_upd_vers_estim_19)
      Retourne l'identifiant du compteur et l'identifiant IGN du tronçon BDTopo associé.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: distance
        type: integer
        description: "Distance maximale de recherche en mètres (par défaut: 100)"

  - name: cte_verif_cpt_mm_section_homo_lin__lineaire_tot
    description: >
      Ajoute un attribut `id_cpt_proche` (TRUE/FALSE) à la linéarisation indiquant si une ligne peut etre affectée à un
      compteur.
      Utilise la CTE [`cte_verif_cpt_mm_section_homo_lin__cpt_proche`](/#!/macro/macro.test_otv.cte_verif_cpt_mm_section_homo_lin__cpt_proche)
      pour identifier les tronçons les plus proches de chaque compteur dans un rayon configurable (par défaut 100 mètres).
      Filtre uniquement les tronçons ayant un compteur affecté (id_comptag IS NOT NULL).
      Retourne toutes les colonnes du modèle de linéarisation plus l'indicateur de proximité.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: distance
        type: integer
        description: "Distance maximale de recherche en mètres pour considérer un compteur comme 'proche' (par défaut: 100)"

  - name: verifier_cpt_mm_section_homo_lin
    description: >
      Identifie les sections homogènes (id_simpli) qui partagent plusieurs compteurs.
      Utilise le modèle [`lin_cte_verif_cpt_mm_section_homo_{dept}__lineaire_tot`](/#!/model/model.test_otv.cte1_mdl12b_lin_chk_cpt_mm_sect_homo_19__linear_tot).
      Retourne les informations de tronçons concernés : id_ign, id_simpli et id_comptag,
      triées par id_simpli pour faciliter l'analyse groupée.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_nb_cpt_ann_n_lin
    description: >
      Connaitre le nombre de compteurs linéarisés
      qui disposent de données de comptage pour l'année spécifiée.
      Peut etre utilisée pour connaitre le nombre de compteurs suspects de l'année considérée.
      Utilise le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.mdl11_lin_upd_vers_estim_19)
      comme source des compteurs linéarisés et la source [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage)
      filtrée sur l'année spécifiée pour vérifier la disponibilité des données de comptage.
      Retourne un COUNT(*) représentant le nombre de compteurs linéarisés disposant effectivement 
      de données de comptage pour l'année concernée.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année des comptages à vérifier au format YYYY (par défaut: variable projet 'annee')"
      - name: suspect
        type: bool
        description: "Indicateur pour filtrer uniquement les compteurs suspects (TRUE) ou tous les compteurs (FALSE) (par défaut: FALSE)"

  - name: verifier_nb_tronc_linearise_lin
    description: >
      Compte le nombre de tronçons linéarisés selon deux métriques complémentaires.
      Utilise le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.mdl11_lin_upd_vers_estim_19)
      comme source des tronçons linéarisés. Effectue deux comptages avec filtres :
      1) nb_cpt_lin_id_cptg : nombre de tronçons ayant un compteur affecté (id_comptag IS NOT NULL).
      2) nb_cpt_lin_otv : nombre de tronçons de source OTV (src_cpt='otv').
      Ces deux métriques peuvent différer si certains tronçons ont src_cpt='otv' mais pas encore d'id_comptag affecté,
      ou si des compteurs ont été affectés à des tronçons provenant d'autres sources.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: update_indic_trafic_lin
    description: >
      Met à jour les indicateurs de trafic (TMJA, %PL, années) pour les tronçons qui référence des compteurs,
      en utilisant les dernières données de comptage disponibles.
      S'appuie sur le modèle [`lin_update_vers_estimation_{dept}`](/#!/model/model.test_otv.mdl11_lin_upd_vers_estim_19)
      et la source [`cptg.vue_compteur_last_annee_know_tmja_pc_pl`](/#!/source/source.test_otv.cptg.vue_compteur_last_annee_know_tmja_pc_pl).
      Effectue un processus en trois étapes via une CTE `reset_indic` et deux UNION :
      1) Réinitialise à NULL les indicateurs de trafic (tmja, pc_pl, ann_pt, ann_pc_pl, pl, veh_km, tmja_final, pl_final, pl_km, obs_tmja, obs_pc_pl)
      pour tous les tronçons OTV (src_cpt='otv').
      2) Met à jour ces indicateurs avec les dernières données de comptage disponibles
      Force coment_cpt='linearisation', obs_tmja=NULL, obs_pc_pl='auto' si %PL manquant.
      3) Conserve les valeurs originales pour tous les autres tronçons (src_cpt != 'otv' ou NULL)
      et les tronçons OTV sans données de comptage disponibles.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_historique_trafic_lin
    description: >
      Fournit le valeurs de `tmja`, `pc_pl`, `obs`, `periode` et `src` pour tout les compteurs.
      Un attribut par année ('wide form').
      Basé sur les sources 
      - [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      - [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage)
      - [`cptg.indic_agrege`](/#!/source/source.test_otv.cptg.indic_agrege).
    arguments:
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: verifier_suspect_indic_lin
    description: >
      Identifie les compteurs linéarisés dont les données de trafic proviennent d'années marquées comme suspectes
      dans la table des comptages, puis fournit l'historique des tmja (ou tmjo), pc_pl, obs, periode et src pour ces compteurs.
      Basé sur le modèle [`lin_update_indic_trafic_{dept}`](/#!/model/model.test_otv.mdl12i_lin_upd_indic_traf_19)
      ,la source [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) et la cte 
      [cte_verif_historique_trafic_lin](/#!/macro/macro.test_otv.cte_verif_historique_trafic_lin).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_cpt_hors_dept_dans_na_lin__list_cpt
    description: >
      Identifie les compteurs référencés dans la linéarisation d'un département dont l'identifiant (id_comptag) 
      indique une appartenance à un autre département de la région Nouvelle-Aquitaine.
      Effectue une analyse textuelle de l'id_comptag (extraction des 2 premiers caractères via split_part)
      et compare avec la liste des départements NA (variable 'dept_na').
      Utilise le modèle [`lin_update_indic_trafic_{dept}`](/#!/model/model.test_otv.mdl12i_lin_upd_indic_traf_19)
      après mise à jour des indicateurs de trafic et joint avec la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      pour récupérer le type de poste. 
      Première étape pour la mise à jour des indicateurs de trafic pour ces compteurs,
      dont certaines valeurs peuvent ne pas être disponibles (en fonction du cycle d'import de chaque département).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères pour lequel on effectue la vérification (par défaut: variable projet 'dept')"

  - name: cte_verif_cpt_hors_dept_dans_na_lin__auto
    description: >
      Associe les données de trafic de l'année du millésime concerné (si disponibles)
      aux compteurs issus de la macro [`cte_verif_cpt_hors_dept_dans_na_lin__list_cpt`](/#!/macro/macro.test_otv.cte_verif_cpt_hors_dept_dans_na_lin__list_cpt)
      . Objectif : mise à jour auto des compteurs hors dept mais dans NA.
      Possible doublon avec des processus précédents.
      Permet de vérifier la disponibilité des données de comptage pour les compteurs d'autres départements NA
    arguments:
      - name: annee
        type: integer
        description: "Année des données de trafic à récupérer au format YYYY (par défaut: variable projet 'annee')"

  - name: update_cpt_hors_dept_dans_na_lin
    description: >
      Met à jour les indicateurs de trafic des tronçons linéarisés qui référencent des compteurs hors département (mais dans NA)
      en intégrant trois sources de données 
      par ordre de priorité : 1) mise à jour automatique des compteurs hors département NA, 
      2) mise à jour manuelle via seed, 3) conservation des valeurs existantes.
      Utilise le modèle [`lin_update_indic_trafic_{dept}`](/#!/model/model.test_otv.mdl12i_lin_upd_indic_traf_19)
      comme base,  Met à jour les compteurs d'autres départements NA ayant des données disponibles
      pour l'année spécifiée via la CTE [`cte_verif_cpt_hors_dept_dans_na_lin__auto`](/#!/macro/macro.test_otv.cte_verif_cpt_hors_dept_dans_na_lin__auto).
      Remplace ann_pt, tmja, pc_pl et pl par les dernières valeurs disponibles, conserve le reste.
      Applique les corrections manuelles issues du seed 
      [`dept{dept}_update_cpt_existant_mano`](/#!/seed/seed.test_otv.sed13c_dept19_upd_cpt_existant_mano).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: integer
        description: "Année du millésime au format YYYY pour forcer ann_pt dans les mises à jour manuelles (par défaut: variable projet 'annee')"
  
  - name: verifier_stats_linearisation_nbpt_lgkm_annee
    description: >
      Calcule les statistiques de linéarisation par année de mise en place des compteurs (ann_pt) :
      nombre de points de comptage distincts et kilométrage total linéarisé.
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.mdl13c_lin_upd_cpt_hors_dept_dans_na_19)
      comme source finale après les mises à jour d'indicateurs de trafic (tmja et pc_pl).
      Filtre uniquement les tronçons linéarisés (src_cpt='otv') pour exclure les estimations.
      Premier modele de verif post-update des tmja et pc_pl
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_stats_linearisation_nbpt_gest
    description: >
      Calcule les statistiques de linéarisation par gestionnnaire :
      nombre de points de comptage distincts.
      Utilise le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_{dept})
      comme source finale après les mises à jour d'indicateurs de trafic (tmja et pc_pl).
      Filtre uniquement les tronçons linéarisés (src_cpt='otv') pour exclure les estimations.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: bool
        description: "drapeau pour permettre ensuite l'agrégation par année (TRUE) ou non (FALSE) (par défaut: FALSE)"

  - name: verifier_stats_linearisation_gests_annees
    description: >
      Calcule les statistiques de linéarisation par gestionnaire et par année de comptage (ann_pt) :
      nombre de points de comptage distincts.
      Utilise la macro [`verifier_stats_linearisation_nbpt_gest`](/#!/macro/macro.test_otv.verifier_stats_linearisation_nbpt_gest)
      comme base.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_coherence_cpt_std_lin__cpt_lin
    description: >
      CTE qui extrait les informations géométriques et techniques des compteurs qui ont été linéarisés.
      Effectue une jointure INNER entre la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      et le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.mdl13c_lin_upd_cpt_hors_dept_dans_na_19)
      pour ne retenir que les compteurs référencés dans la linéarisation.
      Retourne les informations essentielles du compteur : identifiant, type de poste, sens de comptage,
      et géométrie ponctuelle. Utilisée comme CTE intermédiaire dans les vérifications de cohérence
      entre les données de comptage source et les données linéarisées.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_coherence_comptag_standardisation_vs_linearisation_lin
    description: >
      Identifie les incohérences entre les compteurs linéarisés et les compteurs standardisés en détectant
      les cas où l'identifiant du compteur linéarisé est différent du plus proche compteur standardisé.
      Utilise la macro [`cte_verif_coherence_cpt_std_lin__cpt_lin`](/#!/macro/macro.test_otv.cte_verif_coherence_cpt_std_lin__cpt_lin).
      Pour chaque compteur linéarisé, retourne le compteur standardisé le plus proche ayant un identifiant différent,
      ainsi que la distance les séparant et la géométrie.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: dist
        type: integer
        description: "Distance maximale de recherche en mètres pour identifier un compteur standardisé proche (par défaut: 10)"

  - name: verifier_stats_importance_nature_estim_lin
    description: >
      Calcule des statistiques agrégées selon les attributs BdTopo "importance" et "nature" sur les tronçons estimé.
      Retourne pour chaque combinaison importance/nature : le nombre de tronçons, la longueur cumulée en km,
      et la liste des numéros de route distincts.
      La liste des valeur de l'attribut "importance" est définie par la variable projet 'importance_verif'.
      S'appuie sur le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_annee_rrn_pas_dispo
    description: >
      Identifie les compteurs du Réseau Routier National (RRN) dont la dernière année de comptage est antérieure
      à l'année du millésime en cours, permettant de détecter les compteurs dont les données ne sont pas à jour. 
      Filtre sur les identifiants de compteurs contenant '-N%' ou '-A%'
      qui correspondent aux conventions de nommage des compteurs RRN (Nationale/Autoroutière).
      Retourne les informations de trafic disponibles : TMJA, année de comptage, année du %PL et %PL.
      S'appuie sur le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_{dept})
      après les mises à jour d'indicateurs de trafic.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: string
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: verifier_coment_tmj_f_values_lin
    description: >
      Extrait la liste unique des valeurs du champ coment_tmj_f (commentaire sur le TMJA) 
      présentes dans les données linéarisées OTV pour un département donné.
      est utilisé à différentes étapes du processus de linéarisation, il faut donc spécifier en argument un modèle (ou une source) dbt.
    arguments:
      - name: model_src
        type: relation
        description: "Modèle dbt source à utiliser (passer ref('nom_modele') ou source('nom_source', 'nom_table'))"

  - name: verifier_coment_tmj_f_reseau_ratio_lin
    description: >
      Analyse des valeurs de coment_tmj_f en fonction du type de réseau routier.
      Extrait le type de réseau depuis l'id_comptag : N/A/D
      et le ratio numérique du champ coment_tmj_f (nombre après le slash).
      S'appuie sur le modèle [`lin_update_cpt_hors_dept_dans_na_{dept}`](/#!/model/model.test_otv.lin_update_cpt_hors_dept_dans_na_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_split_id_comptag_lin
    description: >
      Extrait une partie spécifique de l'identifiant de comptage (id_comptag) 
      en utilisant la fonction split_part. Permet de récupérer les différents segments 
      de l'id_comptag (département, route, PR, etc.) selon un séparateur personnalisable.
    arguments:
      - name: modele
        type: string
        description: "Nom du modèle dbt à utiliser comme source de données (ne pas jouter 'ref()' : juste le nom du modele)"
      - name: part
        type: int
        description: "Numéro de la partie à extraire (par défaut: 1 pour extraire le département)"
      - name: separator
        type: string
        description: "Séparateur utilisé pour découper id_comptag (par défaut: '-')"

  - name: update_coment_tmj_f_itself_lin
    description: >
      Met à jour le champ `coment_tmj_f` en remplaçant sa valeur par une valeur fournie 
      manuellement.
      S'appuie sur le seed [`dept{dept}_update_coment_tmj_f_with_coment_tmj_f`](/#!/seed/seed.test_otv.dept19.lin.sed14e_dept19_upd_cmt_tmj_f_with_cmt_tmj_f)..
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_coment_tmj_f_attr_modif
    description: >
      Cherche les tronçons linéarisés du RRN dont le champ `coment_tmj_f` pourrait avoir été modifié
      à cause d'un changement d'attribut Bdtopo (en particulier le champs `importance`).
      Utilise le modèle [`lin_update_coment_tmj_f_itself_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_itself_19)
      comme source de données après mise à jour manuelle du champ `coment_tmj_f`.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_coment_tmj_f_recup
    description: >
      Cherche les tronçons linéarisés du RRN dont le champ `coment_tmj_f` pourrait être faux
      puisque ce sont de nouveaux tronçons (le champs `recup` n'est pas null).
      Utilise le modèle [`lin_update_coment_tmj_f_itself_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_itself_19)
      comme source de données après mise à jour manuelle du champ `coment_tmj_f`.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: update_coment_tmj_f_with_ids
    description: >
      Met à jour le champ `coment_tmj_f` en remplaçant par une valeur fournie 
      manuellement, avec identifiant des lignes concernees grace au champs id_ign ou id_simpli.
      Peut etre utilisé à différent moment du processus de linéarisation, donc nécessite la saisie en paramètre 
      d'un modèle dbt source.
      S'appuie sur le seed [`dept{dept}_update_coment_tmj_f_with_ids`](/#!/seed/seed.test_otv.dept19.lin.sed15a_dept19_upd_cmt_tmj_f_with_ids)..
    arguments:
      - name: model_src
        type: relation
        description: "Modèle dbt source à utiliser (passer ref('nom_modele') ou source('nom_source', 'nom_table'))"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_numero_rrn_lin
    description: >
      Extrait la liste unique des numéros de routes présents dans la base linéarisée 
      pour les routes du Réseau Routier National (RRN) d'un département donné.
      Filtre selon les classes administratives définies dans la variable `cl_admin_rrn_verif`.
      S'appuie sur le modèle [`lin_update_coment_tmj_f_lui_mm_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_lui_mm_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_valeurs_aberrantes_tmja__ann_n_n_1
    description: >
      Compare les années de comptage et tmja du dferniere millésimes avec les des deux 
      derniers comptages connus, pour les comptages linearises.
      Utilise le modèle [`lin_update_coment_tmj_f_lui_mm_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_lui_mm_{dept})
      et la source [`cptg.vue_evolutions_tmja`](/#!/source/source.test_otv.cptg.vue_evolutions_tmja).
      CTE de la requete globale de vérification d'évolution des trafics [`verifier_valeurs_aberrantes_tmja`](/#!/macro/macro.test_otv.verifier_valeurs_aberrantes_tmja).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: cte_verif_valeurs_aberrantes_tmja__evol_ann_n_n_1
    description: >
      Calcule l'évolution des valeurs de TMJA entre le millésime actuel et le précédent pour détecter les valeurs aberrantes.
      Pour chaque point de comptage, extrait la dernière année disponible et calcule la différence absolue et 
      l'évolution en pourcentage du trafic. Retourne également le nombre total d'années disponibles 
      par compteur et les valeurs TMJA des millésimes N, N-1 et N-2.
      S'appuie sur la macro [cte_verif_valeurs_aberrantes_tmja__ann_n_n_1](/#!/macro/macro.test_otv.cte_verif_valeurs_aberrantes_tmja__ann_n_n_1)
      et sur la source [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage).
      CTE de la requête globale de vérification d'évolution des trafics [`verifier_valeurs_aberrantes_tmja`](/#!/macro/macro.test_otv.verifier_valeurs_aberrantes_tmja).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: verifier_valeurs_aberrantes_tmja
    description: >
      Identifie les valeurs aberrantes de TMJA en analysant l'évolution entre deux millésimes consécutifs.
      Filtre les variations importantes (en pourcentage et en valeur absolue) pour détecter 
      les incohérences ou erreurs potentielles dans les données de trafic.
      S'appuie sur le modèle [`lin_cte_verif_vals_abertes_tmja_{dept}__evol_ann_n_n_1`](/#!/model/model.test_otv.lin_cte_verif_vals_abertes_tmja_{dept}__evol_ann_n_n_1).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: seuil_evol
        type: integer
        description: "Seuil d'évolution en pourcentage au-delà duquel la variation est considérée comme aberrante (par défaut: 20)"
      - name: seuil_diff
        type: integer
        description: "Seuil de différence absolue de TMJA au-delà duquel la variation est considérée comme aberrante (par défaut: 300)"
      - name: ann_n_filter
        type: string
        description: "Millésime de référence (Millésime N) pour le filtrage (par défaut: variable projet 'annee')"
      - name: ann_n_1_filter
        type: string
        description: "Millésime de comparaison (Millésime N-1) optionnelle pour un filtrage supplémentaire (par défaut: none)"
      - name: id_comptag_like
        type: string
        description: "Filtre optionnel sur l'identifiant de comptage via pattern LIKE SQL (par défaut: none)"
      - name: percentile_value
        type: float
        description: "Valeur de percentile à calculer sur l'évolution (ex: 0.95 pour le 95e percentile) (par défaut: none)"

  - name: cte_verif_evol_cpt_dev_assoc__pt_ann_n
    description: >
      Identifie les points de comptage de l'année N-1 qui ne sont plus présents dans la linéarisation 
      de l'année N (points de comptage devenus associés). 
      Retourne les id_comptag, année et TMJA 
      de l'année N-1 pour les compteurs qui ne sont plus linéarisés en année N.
      CTE utilisée dans le cadre de la vérification de l'évolution des points de comptage.
      S'appuie sur la linéarisation de l'année précédente 
      et le modèle [`lin_update_coment_tmj_f_lui_mm_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_lui_mm_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: string
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: cte_verif_evol_cpt_dev_assoc__pt_ann_n_asso
    description: >
      Enrichit les points de comptage de l'année N-1 devenus associés en année N avec leurs informations 
      de comptage associé (type de poste et compteur de référence). 
      S'appuie sur la CTE [`cte_verif_evol_cpt_dev_assoc__pt_ann_n`](/#!/macro/macro.test_otv.cte_verif_evol_cpt_dev_assoc__pt_ann_n) 
      et la table `comptage_assoc.compteur`.
      Retourne id_cpteur_asso, ann_lin_n_1, tmja_lin_n_1, typ_post_lin_n_1 et id_cpteur_ref 
      pour analyser l'évolution des compteurs ayant changé de statut.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: string
        description: "Année du millésime au format YYYY (par défaut: variable projet 'annee')"

  - name: mcr_verifier_evo_cptg_devient_asso_lin
    description: >
      Analyse l'évolution du trafic (TMJA) entre l'année N et N-1 pour les compteurs devenus associés.
      Compare les valeurs de trafic d'un compteur associé (via son compteur de référence) entre deux années
      et calcule la différence absolue et l'évolution en pourcentage.
      S'appuie sur la CTE [cte_verif_evol_cpt_dev_assoc__pt_ann_n_asso](/#!/macro/macro.test_otv.cte_verif_evol_cpt_dev_assoc__pt_ann_n_asso),
      le modèle [`lin_update_coment_tmj_f_ids_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_ids_{dept})
      et la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: string
        description: "Année de référence au format YYYY (par défaut: variable projet 'annee')"

  - name: verifier_periode_lin
    description: >
      Identifie les compteurs ponctuels ou tournant, départementaux ou d'agglo dont la période de comptage 
      se situe en juillet ou août (période estivale).
      Permet de détecter les comptages effectués pendant les vacances d'été, 
      S'appuie sur la source [`cptg.vue_compteur_last_annee_know_tmja_pc_pl`](/#!/source/source.test_otv.cptg.vue_compteur_last_annee_know_tmja_pc_pl)
      et le modèle [`lin_update_coment_tmj_f_ids_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_ids_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_verifier_ann_cptgassoc_cptgref_lin
    description: >
      Vérifie la cohérence temporelle entre les années de comptage des compteurs associés 
      et leurs compteurs de référence. Identifie les cas où un compteur associé possède 
      des données TMJA plus récentes que celles du compteur de référence qui lui est rattaché.
      S'appuie sur le modèle [`lin_update_coment_tmj_f_ids_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_ids_{dept}),
      la source [`cptg.vue_compteur_last_annee_know_tmja_pc_pl`](/#!/source/source.test_otv.cptg.vue_compteur_last_annee_know_tmja_pc_pl)
      et la source [`cptg_assoc.vue_compteur_last_annee_know_tmja_pc_pl`](/#!/source/source.test_otv.cptg_assoc.vue_compteur_last_annee_know_tmja_pc_pl).
      Retourne pour chaque compteur concerné : id_comptag, type_poste, tmja, ann_pt, période
      ainsi que les informations du compteur associé (id_cpteur_asso, type_poste, tmja, annee_tmja, période).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_verifier_cptg_sens_unique_lin
    description: >
      Identifie les compteurs configurés en sens unique dans la base de données
      et présents dans les tronçons linéarisés.
      Filtre uniquement ceux dont le sens de comptage (`sens_cpt`) 
      correspond à la valeur de sens unique définie dans la variable `cptg_sens_uniq_verif`.
      S'appuie sur la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur).
      Retourne uniquement les identifiants des compteurs (id_comptag).
    arguments:
      - name: model_src
        type: relation
        description: "Modèle dbt source à utiliser (passer ref('nom_modele') ou source('nom_source', 'nom_table'))"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_verifier_sens_bretelles_rrn_lin
    description: >
      Vérifie la cohérence entre le sens de circulation des bretelles RRN (entrées/sorties) dans la BDTopo 
      et le sens configuré dans la table des compteurs, en contrôlant la validité du coefficient `coment_tmj_f`.
      Retourne uniquement les lignes où la vérification échoue (incohérence détectée).
      Les règles de cohérence vérifiées sont :
      - Compteur sens unique + BDTopo sens unique → coment_tmj_f null (valide)
      - Compteur sens unique + BDTopo double sens → coment_tmj_f='*2' (valide)
      - Compteur double sens + BDTopo double sens → coment_tmj_f null (valide)
      - Compteur double sens + BDTopo sens unique → coment_tmj_f='/2' (valide)
      S'appuie sur le modèle [`lin_update_coment_tmj_f_ids_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_ids_{dept})
      et la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_verifier_recup_agglo_lin
    description: >
      Analyse le statut de récupération (champ `recup`) des tronçons linéarisés par gestionnaire d'agglomération.
      Identifie les tronçons gérés par les agglomérations définies dans la variable projet (ex: `agglo_19`)
      et compte leur répartition selon la présence ou non d'une valeur dans le champ `recup`.
      Permet de suivre quels tronçons ont été récupérés ou modifiés pour chaque gestionnaire d'agglomération.
      S'appuie sur le modèle [`lin_update_coment_tmj_f_sens_{dept}`](/#!/model/model.test_otv.lin_update_coment_tmj_f_sens_{dept}).
      Retourne le gestionnaire, le statut recup, et le nombre de tronçons concernés.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_verifier_sens_tronc_proche_cpt_lin
    description: >
      Vérifie la cohérence entre le sens de comptage (sens_cpt) (issu des données gestionnaires)
      et le sens du tronçon BDTopo (sens) linéarisés le plus proches
      Identifie les incohérences car elle ne respecte pas les règles suivantes :
      - Compteur sens unique + BDTopo sens unique → coment_tmj_f null (valide)
      - Compteur sens unique + BDTopo double sens → coment_tmj_f='*2' (valide)
      - Compteur double sens + BDTopo double sens → coment_tmj_f null (valide)
      - Compteur double sens + BDTopo sens unique → coment_tmj_f='/2' (valide)
      S'appuie sur la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur)
      et le modèle [`mdl_lin_update_coment_tmj_f_sens_{dept}`](/#!/model/model.test_otv.mdl_lin_update_coment_tmj_f_sens_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: dist_tronc_cpt
        type: integer
        description: "Distance maximale en mètres entre un compteur et un tronçon pour être considéré comme proche (par défaut: 50)"

  - name: mcr_verifier_sens_coment_tmj_f_hors_agglo_lin
    description: >
      Vérifie la cohérence entre le sens des compteurs (sens_cpt) et le champ coment_tmj_f 
      des tronçons linéarisés hors agglomération. Cette macro identifie les incohérences 
      selon quatre cas de figure attendus : 
      (1) compteur sens unique sur tronçon sens unique → coment_tmj_f null,
      (2) compteur sens unique sur tronçon double sens → coment_tmj_f='*2',
      (3) compteur double sens sur tronçon double sens → coment_tmj_f null,
      (4) compteur double sens sur tronçon sens unique → coment_tmj_f='/2'.
      Exclut les ratios spécifiques (/3, /4, /8) de la vérification.
      Retourne uniquement les lignes où la vérification échoue (verif_coment_tmj_f=false).
      S'appuie sur le modèle [`mdl_lin_update_coment_tmj_f_sens_{dept}`](/#!/model/model.test_otv.mdl_lin_update_coment_tmj_f_sens_{dept})
      et la source [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_verifier_recup_linearisation_lin
    description: >
      Macro de vérification des tronçons linéarisés issue de la récupération.
      Calcule le nombre de tronçons linéarisés groupés par valeur de `recup`.
      S'appuie sur le modèle [`mdl_lin_update_coment_tmj_f_sens_dbl_spl_{dept}`](/#!/model/model.test_otv.mdl_lin_update_coment_tmj_f_sens_dbl_spl_{dept}).
      Filtre uniquement les tronçons linéarisés (coment_cpt='linearisation') pour exclure les estimations.
      Retourne le nombre de tronçons (cnt) et la valeur du champ recup.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_verifer_id_comptag_mill_en_cours_lin
    description: >
      Macro de vérification qui extrait la liste distincte des identifiants de comptage (id_comptag)
      linéarisés pour l'année du millésime en cours.
      S'appuie sur le modèle [`mdl_lin_update_coment_tmj_f_sens_dbl_spl_{dept}`](/#!/model/model.test_otv.mdl_lin_update_coment_tmj_f_sens_dbl_spl_{dept}).
      Retourne la liste triée des id_comptag distincts.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
      - name: annee
        type: string
        description: "Année du millésime en cours au format YYYY (par défaut: variable projet 'annee')"

  - name: mcr_update_tmja_final_lin
    description: >
      Macro de calcul du TMJA final (tmja_final) en appliquant les ratios définis dans le champ coment_tmj_f.
      Calcule le TMJA ajusté selon trois cas :
      - Si coment_tmj_f est null : arrondi du tmja brut
      - Si coment_tmj_f = '*2' : tmja multiplié par 2 (pour sens unique avec compteur double sens)
      - Si coment_tmj_f like '/%' : tmja divisé par le ratio (ex: '/2' pour compteur double sens sur tronçon en sens unique)
      Filtre uniquement les tronçons linéarisés (coment_cpt='linearisation').
      S'appuie sur le modèle [`mdl_lin_update_coment_tmj_f_sens_dbl_spl_{dept}`](/#!/model/model.test_otv.mdl_lin_update_coment_tmj_f_sens_dbl_spl_{dept}).
      Retourne toutes les colonnes du modèle source plus le champ tmja_final calculé.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_update_veh_km_lin
    description: >
      Macro de calcul du nombre de véhicules-kilomètres (veh_km) pour les tronçons linéarisés.
      Calcule veh_km = tmja_final * long_km pour les tronçons avec coment_cpt='linearisation'.
      Les tronçons non linéarisés (coment_cpt != 'linearisation' ou null) conservent leur valeur veh_km d'origine.
      S'appuie sur le modèle [`mdl_lin_update_tmja_final_{dept}`](/#!/model/model.test_otv.mdl_lin_update_tmja_final_{dept}).
      Retourne toutes les colonnes du modèle source avec le champ veh_km recalculé pour les linéarisations.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"

  - name: mcr_update_pl_final_pl_km_lin
    description: >
      Macro de calcul du nombre de poids lourds final (pl_final) et des poids lourds-kilomètres (pl_km) pour les tronçons linéarisés.
      Calcule pl_final en appliquant les ratios définis dans le champ coment_tmj_f sur le champ pl selon six cas :
      - Si coment_tmj_f est null et pl = 0 : pl_final = 0
      - Si coment_tmj_f est null et pl <> 0 : pl_final = arrondi du pl brut
      - Si coment_tmj_f = '*2' et pl = 0 : pl_final = 0
      - Si coment_tmj_f = '*2' et pl <> 0 : pl_final = pl * 2
      - Si coment_tmj_f like '/%' et pl = 0 : pl_final = 0
      - Si coment_tmj_f like '/%' et pl <> 0 : pl_final = pl / ratio (ex: '/2')
      Calcule ensuite pl_km = pl_final * long_km.
      Filtre les tronçons linéarisés où pl is not null. Les autres tronçons conservent leurs valeurs d'origine.
      S'appuie sur le modèle [`mdl_lin_update_veh_km_{dept}`](/#!/model/model.test_otv.mdl_lin_update_veh_km_{dept}).
      Retourne toutes les colonnes du modèle source avec les champs pl_final et pl_km recalculés.
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
        
  - name: mcr_verifier_pc_pl_after_update_final_lin
    description: >
      Macro de vérification identifiant les tronçons linéarisés où le pourcentage de poids lourds (pc_pl) est null
      après la mise à jour des indicateurs pl_final et pl_km.
      Filtre uniquement les enregistrements où coment_cpt='linearisation' et pc_pl is null.
      Retourne le nombre total d'enregistrements, le nombre de compteurs distincts concernés, et la liste des id_comptag.
      S'appuie sur le modèle [`mdl_lin_update_pl_final_pl_km_{dept}`](/#!/model/model.test_otv.mdl_lin_update_pl_final_pl_km_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
        
  - name: mcr_verifier_pc_pl_after_update_group_gest_lin
    description: >
      Macro de vérification identifiant les tronçons linéarisés où le pourcentage de poids lourds (pc_pl) est null
      après la mise à jour des indicateurs pl_final et pl_km.
      Filtre uniquement les enregistrements où coment_cpt='linearisation' et pc_pl is null.
      Groupe les résultats par gestionnaire et retourne le nombre de compteurs distincts (cnt_cpt) par gestionnaire (gest).
      Le gestionnaire est extrait de l'id_comptag via split_part sur le premier segment avant '-'.
      S'appuie sur le modèle [`mdl_lin_update_pl_final_pl_km_{dept}`](/#!/model/model.test_otv.mdl_lin_update_pl_final_pl_km_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
  
  - name: mcr_verifier_indic_agrege_after_update_lin
    description: >
      Macro de vérification des valeurs des indicateurs agrégés de comptage
      pour une liste spécifique d'identifiants de comptage (id_comptag).
      Fournit l'ensemble des données d'indicateurs agrégés (t1.*) ainsi que l'identifiant de comptage,
      l'année de comptage et le type de poste.
      S'appuie sur les sources [`cptg.indic_agrege`](/#!/source/source.test_otv.cptg.indic_agrege),
      [`cptg.comptage`](/#!/source/source.test_otv.cptg.comptage) et [`cptg.compteur`](/#!/source/source.test_otv.cptg.compteur).
    arguments:
      - name: list_id_comptag
        description: "Liste des identifiants de comptage à filtrer (par défaut: [] ; exemple: ['19-D001-2+300', '19-D002-1+800', ...])"
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
  
  - name: mcr_update_coment_cpt_lin
    description: >
      Met à jour le champ `coment_cpt` en fonction de la valeur du champ `src_cpt`.
      Si `src_cpt = 'otv'`, alors `coment_cpt = 'linearisation'`, sinon `coment_cpt = 'estimation'`.
      Retourne toutes les colonnes du modèle source avec le champ coment_cpt recalculé.
      S'appuie sur le modèle [`mdl_lin_update_pl_final_pl_km_{dept}`](/#!/model/model.test_otv.mdl_lin_update_pl_final_pl_km_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
  
  - name: mcr_update_coment_tmj_f_estimation_lin
    description: >
      Met à jour le champ `coment_tmj_f` pour les tronçons ayant un comptage par estimation (`coment_cpt = 'estimation'` et `src_cpt is null`).
      Applique une logique de division par 2 pour les routes à sens unique :
      si `sens` correspond à un sens unique (selon la variable `bdtopo_sens_uniq_verif`), alors `coment_tmj_f = '/2'`, 
      sinon `coment_tmj_f = null` (pour les doubles sens selon `bdtopo_double_sens_verif`).
      Retourne toutes les colonnes du modèle source avec le champ coment_tmj_f recalculé lorsque nécessaire.
      S'appuie sur le modèle [`mdl_lin_update_coment_cpt_{dept}`](/#!/model/model.test_otv.mdl_lin_update_coment_cpt_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"
  
  - name: mcr_statistiques_linearisation
    description: >
      Génère un ensemble de statistiques synthétiques sur l'état de la linéarisation pour un département donné.
      Calcule les indicateurs suivants :
      - Longueur totale du réseau (long_tot) et longueur linéarisée (long_lin)
      - Longueurs linéarisées par année : année N (long_lin_pt_ann_n) et années antérieures (long_lin_pt_inf_ann_n)
      - Nombre de compteurs OTV total (compteur_otv), pour l'année N (compteur_otv_pt_ann_n) et antérieurs (compteur_otv_pt_inf_ann_n)
      - Pourcentages de linéarisation : % du réseau total linéarisé (prc_lin_tot), % du réseau total linéarisé pour l'année N (prc_lin_ann_n), 
      et % de la linéarisation année N par rapport à la linéarisation totale (lin_ann_n_lin_tot)
      Retourne une seule ligne avec l'ensemble de ces statistiques agrégées.
      S'appuie sur le modèle source passé en argument (généralement un modèle de linéarisation finalisé).
    arguments:
      - name: models_src
        type: string
        description: "Modèle DBT source contenant les données de linéarisation (requis, généralement ref('mdl_lin_...'))"
      - name: annee
        type: string
        description: "Année du millésime à analyser au format YYYY (par défaut: variable projet 'annee')"

  - name: mcr_vue_lin_finale
    description: >
      Génère la vue finale de linéarisation, basée sur le modèle [`mdl_lin_update_coment_tmj_f_estim_{dept}`](/#!/model/model.test_otv.mdl_lin_update_coment_tmj_f_estim_{dept}).
    arguments:
      - name: dept
        type: string
        description: "Code du département sur 2 caractères (par défaut: variable projet 'dept')"