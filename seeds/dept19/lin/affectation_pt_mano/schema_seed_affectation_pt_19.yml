version: 2

seeds:
  - name: sed7_dept19_upd_nouv_pt
    description: >
      Affectation manuelle de nouveau comptages vers des lignes BdTopo dans le dept 19
      milléisme 2024.
      les champs id_ign et id_simpli sont exclusifs : si l'un est renseigné, l'autre doit être null ; 
      si plusieurs lignes sont concernées, elles doivent etre séparées par des ';'.
      Le champs cree_le doit être renseigné.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(id_ign is not null and id_simpli is null) or (id_ign is null and id_simpli is not null)"
            description: "Vérifier que id_ign et id_simpli sont mutuellement exclusifs : si l'un est non null, l'autre doit être null."
    config: # Config avant post-hook pour les colonnes id_ign et id_simpli (voir fichier dbt_project.yml)
      column_types:
        id_comptag: "varchar(254)"
        id_ign: text
        id_simpli: text
        coment_tmj_f: "varchar(254)"
        obs_tmja: "varchar(254)"
        obs_pc_pl: "varchar(254)"
        obs_supl: "varchar(254)"
        id_sect: "varchar(254)"
        src_sect: "varchar(254)"
        autor_sect: "varchar(254)"
        obs_vts: "varchar(254)"
        id_cpt1: "varchar(254)"
        cree_le: "char(10)"
        modifie_le: "char(10)"
    columns:
      - name: id_comptag
        description: "Identifiant du compteur"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
                description: "Vérifier que chaque id_comptag dans ce fichier existe dans la table comptage.compteur."
      - name: id_ign
        description: "Identifiant IGN du(es) tronçon BdTopo linéarisé (séparation par ';' si plusieurs tronçons)"
      - name: id_simpli
        description: "Identifiant de section homogène interne OTR (séparation par ';' si plusieurs tronçons)"
      - name: coment_tmj_f
        description: "Commentaire sur le mode de calcul (i.e divise ou multiplie et le facteur) du tmja et le nombre de ligne qui représente la route"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_tmj_verif') }}"
      - name: obs_tmja
        description: "Observation sur le TMJA"
      - name: obs_pc_pl
        description: "Observation sur la part de PL"
      - name: obs_supl
        description: "Observation supplémentaire"
      - name: id_sect
        description: "Identifiant de section"
      - name: src_sect
        description: "Source de la section"
      - name: autor_sect
        description: "Auteur de la section"
      - name: obs_vts
        description: "Observation sur les vitesses"
      - name: id_cpt1
        description: "Attributs de travail sur les compteurs (calcul sur Bdx Metropole notamment)"
      - name: cree_le
        description: "Date de création de la ligne"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de création est au format YYYY-MM-DD."
      - name: modifie_le
        description: "Date de modification de la ligne"
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de modification est au format YYYY-MM-DD."
                row_condition: "modifie_le is not null"

  - name: sed8_dept19_upd_modif_linear
    description: >
      Modification manuelle de la linéarisation de comptages existants dans le dept 19
      millésime 2024 : affectation d'une partie du sectionnement à un autre point de comptage existant.
      La valeur de `id_comptag` fournie est celle du point de comptage vers lequel les lignes vont être rattachées.
      Les champs id_ign et id_simpli sont exclusifs : si l'un est renseigné, l'autre doit être null ; 
      si plusieurs lignes sont concernées, elles doivent être séparées par des ';'.
    config:
      column_types:
        id_comptag: "varchar(254)"
        id_ign: "text"
        id_simpli: "text"
        cree_le: "char(10)"
        modifie_le: "char(10)"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(id_ign is not null and id_simpli is null) or (id_ign is null and id_simpli is not null)"
            description: "Vérifier que id_ign et id_simpli sont mutuellement exclusifs : si l'un est non null, l'autre doit être null."
    columns:
      - name: id_comptag
        description: "Identifiant du nouveau compteur de référence pour les lignes concernées"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
                description: "Vérifier que chaque id_comptag dans ce fichier existe dans la table comptage.compteur."
      - name: id_ign
        description: "Nouvel identifiant IGN du(es) tronçon BdTopo linéarisé (séparation par ';' si plusieurs tronçons)"
      - name: id_simpli
        description: "Nouvel identifiant de section homogène interne OTR (séparation par ';' si plusieurs tronçons)"
      - name: cree_le
        description: "Date de création de la ligne"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de création est au format YYYY-MM-DD."
      - name: modifie_le
        description: "Date de modification de la ligne"
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de modification est au format YYYY-MM-DD."
                row_condition: "modifie_le is not null"

  - name: sed9_dept19_upd_oubli_erreur_linear
    description: >
      Correction manuelle d'oublis de linéarisation de comptages existants dans le dept 19
      millésime 2024 : affectation de lignes BdTopo qui auraient dû être rattachées à un point de comptage existant
      mais qui ont été oubliées lors de la linéarisation initiale.
      Les champs id_ign et id_simpli sont exclusifs : si l'un est renseigné, l'autre doit être null ; 
      si plusieurs lignes sont concernées, elles doivent être séparées par des ';'.
    config:
      column_types:
        id_comptag: "varchar(254)"
        id_ign: "text"
        id_simpli: "text"
        cree_le: "char(10)"
        modifie_le: "char(10)"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(id_ign is not null and id_simpli is null) or (id_ign is null and id_simpli is not null)"
            description: "Vérifier que id_ign et id_simpli sont mutuellement exclusifs : si l'un est non null, l'autre doit être null."
    columns:
      - name: id_comptag
        description: "Identifiant du compteur de référence pour les lignes oubliées"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
                description: "Vérifier que chaque id_comptag dans ce fichier existe dans la table comptage.compteur."
      - name: id_ign
        description: "Identifiant IGN du(es) tronçon BdTopo des lignes concernées (séparation par ';' si plusieurs tronçons)"
      - name: id_simpli
        description: "Identifiant de section homogène interne OTR des lignes concernées (séparation par ';' si plusieurs tronçons)"
      - name: cree_le
        description: "Date de création de la ligne"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de création est au format YYYY-MM-DD."
      - name: modifie_le
        description: "Date de modification de la ligne"
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de modification est au format YYYY-MM-DD."
                row_condition: "modifie_le is not null"

  - name: sed10_dept19_upd_etire_linear
    description: >
      Étirement de la linéarisation de comptages existants dans le dept 19
      millésime 2024 : extension de la linéarisation d'un point de comptage existant
      en y rattachant des lignes BdTopo supplémentaires.
      Les champs id_ign et id_simpli sont exclusifs : si l'un est renseigné, l'autre doit être null ; 
      si plusieurs lignes sont concernées, elles doivent être séparées par des ';'.
    config:
      column_types:
        id_comptag: "varchar(254)"
        id_ign: "text"
        id_simpli: "text"
        cree_le: "char(10)"
        modifie_le: "char(10)"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(id_ign is not null and id_simpli is null) or (id_ign is null and id_simpli is not null)"
            description: "Vérifier que id_ign et id_simpli sont mutuellement exclusifs : si l'un est non null, l'autre doit être null."
    columns:
      - name: id_comptag
        description: "Identifiant du compteur dont la linéarisation doit être étendue"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
                description: "Vérifier que chaque id_comptag dans ce fichier existe dans la table comptage.compteur."
      - name: id_ign
        description: "Identifiant IGN du(es) tronçon BdTopo des lignes concernées (séparation par ';' si plusieurs tronçons)"
      - name: id_simpli
        description: "Identifiant de section homogène interne OTR des lignes concernées (séparation par ';' si plusieurs tronçons)"
      - name: cree_le
        description: "Date de création de la ligne"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de création est au format YYYY-MM-DD."
      - name: modifie_le
        description: "Date de modification de la ligne"
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de modification est au format YYYY-MM-DD."
                row_condition: "modifie_le is not null"

  - name: sed11_dept19_upd_vers_estim_linear
    description: >
      Changement de statut de tronçon linéarisés vers estimés dans le dept 19
      millésime 2024 : des tronçons attachés à des points de comptages doivent être estimés.
      Les champs id_ign, id_simpli et id_comptag sont mutuellement exclusifs : 
      un seul de ces trois champs peut être renseigné à la fois pour identifier les objets concernés.
      Si plusieurs lignes sont concernées pour un même identifiant, elles doivent être séparées par des ';'.
    config:
      column_types:
        id_comptag: "varchar(254)"
        id_ign: "text"
        id_simpli: "text"
        cree_le: "char(10)"
        modifie_le: "char(10)"
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(id_ign is not null and id_simpli is null and id_comptag is null) or (id_ign is null and id_simpli is not null and id_comptag is null) or (id_ign is null and id_simpli is null and id_comptag is not null)"
            description: "Vérifier que id_ign, id_simpli et id_comptag sont mutuellement exclusifs : un seul de ces trois champs peut être non null."
    columns:
      - name: id_ign
        description: "Identifiant IGN du(es) tronçon BdTopo des lignes concernées (séparation par ';' si plusieurs tronçons)"
      - name: id_simpli
        description: "Identifiant de section homogène interne OTR des lignes concernées (séparation par ';' si plusieurs tronçons)"
      - name: id_comptag
        description: "Identifiant du compteur dont les tronçons linéarisés doivent passer en estimation"
        data_tests:
          - relationships:
              arguments:
                to: source('cptg', 'compteur')
                field: id_comptag
                description: "Vérifier que chaque id_comptag dans ce fichier existe dans la table comptage.compteur."
              config:
                where: "id_comptag is not null"
      - name: cree_le
        description: "Date de création de la ligne"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de création est au format YYYY-MM-DD."
      - name: modifie_le
        description: "Date de modification de la ligne"
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^20[2-9][0-9]-(0[1-9]|1[0-2])-([0-2][0-9]|3[0-1])$"
                description: "Vérifier que la date de modification est au format YYYY-MM-DD."
                row_condition: "modifie_le is not null"
