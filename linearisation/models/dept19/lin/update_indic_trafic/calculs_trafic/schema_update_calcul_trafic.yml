          - accepted_values:
              arguments:
                values: "{{ var('coment_cpt_verif') }}"
      - name: src_cpt
        description: "Source du comptage : 'otv' ou 'lin_bm' pour les linearisations, null pour les estimations"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('src_cpt_verif') }}"
              config:
                where: "src_cpt is not null"
      - name: id_comptag
        description: "Identifiant du comptage"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null"
              config:
                where: "coment_cpt = 'linearisation'"
              description: "Verifier que id_comptag est renseigne pour les linearisations"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null"
              config:
                where: "coment_cpt = 'estimation'"
              description: "Verifier que id_comptag est null pour les estimations"
      - name: src_cpteur
        description: "Source de la donnee de comptage"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('src_cpteur_verif') }}"
