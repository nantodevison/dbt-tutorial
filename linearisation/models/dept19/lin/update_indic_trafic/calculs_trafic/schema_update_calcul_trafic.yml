      - name: ann_pt
        description: "Annee du TMJA"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^[0-9]{4}$' AND ann_pt::integer >= 2000 AND ann_pt::integer <= {{ var('annee') }}"
              config:
                where: "ann_pt is not null"
              description: "Verifier que l'annee du TMJA est au format 4 chiffres et comprise entre 2000 et l'annee en cours"
      - name: ann_pc_pl
        description: "Annee du pourcentage poids-lourds"
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "~ '^[0-9]{4}$' AND ann_pc_pl::integer >= 2000 AND ann_pc_pl::integer <= {{ var('annee') }}"
              config:
                where: "ann_pc_pl is not null"
              description: "Verifier que l'annee du %PL est au format 4 chiffres et comprise entre 2000 et l'annee en cours"
      - name: coment_tmj
        description: "Calcul sur le TMJA pour determiner le TMJA final (repris du millesime N-1)"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_tmj_verif') }}"
              config:
