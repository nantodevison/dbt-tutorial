version: 2

models:
  - name: mdl18a_lin_upd_tmja_final_19
    description: >
      Modele de calcul du TMJA final (tmja_final) en appliquant les ratios definis dans le champ coment_tmj_f.
      Base sur la macro [`mcr_18a_maj_tmja_final_lin`](/#!/macro/macro.linearisation.mcr_18a_maj_tmja_final_lin).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mdl1_creer_vue_19')
            description: "Verifier que le nombre de lignes dans ce modele est identique a celui du modele de base mdl1_creer_vue_19"
    columns:
      - name: id
        description: "Identifiant unique interne OTR genere automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
          - not_null
      - name: tmja
        description: "TMJA non null pour les tronÃ§ons linearises (coment_cpt = 'linearisation')"
        data_tests:
          - not_null:
              arguments:
                where: "coment_cpt = 'linearisation'"
      - name: tmja_final
        description: "TMJA final calcule en appliquant le ratio defini dans coment_tmj_f sur le tmja brut"
        data_tests:
          - not_null:
              arguments:
                where: "coment_cpt = 'linearisation'"
      - name: coment_tmj_f
        description: "Calcul sur le tmja (ex : /2 si sens = Direct ou Inverse) pour determiner le tmja final valide"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_tmj_verif') }}"
      - name: coment_cpt
        description: "Type de commentaire sur le comptage (linearisation ou estimation)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('coment_cpt_verif') }}"
      - name: long_km
        description: "Longueur du tronÃ§on en km"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: " > 0"
                description: "Verifier que la longueur du tronÃ§on est positive"

  - name: mdl19_lin_upd_veh_km_19
    description: >
      Modele de calcul du nombre de vehicules-kilometres (veh_km) pour les tronÃ§ons linearises.
      Base sur la macro [`mcr_19_maj_veh_km_lin`](/#!/macro/macro.linearisation.mcr_19_maj_veh_km_lin).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mdl1_creer_vue_19')
            description: "Verifier que le nombre de lignes dans ce modele est identique a celui du modele de base mdl1_creer_vue_19"
    columns:
      - name: id
        description: "Identifiant unique interne OTR genere automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
          - not_null
      - name: veh_km
        description: "Nombre de vehicules-kilometres calcule (formule : tmja_final * long_km)"
        data_tests:
          - not_null:
              arguments:
                where: "coment_cpt = 'linearisation'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= tmja_final * long_km and veh_km > 0"
                where: "coment_cpt = 'linearisation'"
                description: "Verifier que le nombre de vehicules-kilometres est correctement calcule (et > 0) a partir du TMJA final et de la longueur du tronÃ§on"

  - name: mdl20_lin_upd_pl_final_pl_km_19
    description: >
      Modele de calcul du nombre de poids lourds final (pl_final) et des poids lourds-kilometres (pl_km).
      Base sur la macro [`mcr_20_maj_pl_final_pl_km_lin`](/#!/macro/macro.linearisation.mcr_20_maj_pl_final_pl_km_lin).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mdl1_creer_vue_19')
            description: "Verifier que le nombre de lignes dans ce modele est identique a celui du modele de base mdl1_creer_vue_19"
    columns:
      - name: id
        description: "Identifiant unique interne OTR genere automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
          - not_null
      - name: pl_final
        description: "Nombre de poids lourds final calcule en appliquant le ratio defini dans coment_tmj_f sur le champ pl"
        data_tests:
          - not_null:
              arguments:
                where: "coment_cpt = 'linearisation' and pl is not null"
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
                where: "coment_cpt = 'linearisation' and pl is not null"
                description: "Verifier que pl_final est positif ou nul"
      - name: pl_km
        description: "Nombre de poids lourds-kilometres calcule (formule : pl_final * long_km)"
        data_tests:
          - not_null:
              arguments:
                where: "coment_cpt = 'linearisation' and pl is not null"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= pl_final::numeric * long_km::numeric"
                where: "coment_cpt = 'linearisation' and pl is not null and pl_final > 0"
                description: "Verifier que pl_km est correctement calcule a partir de pl_final et de la longueur du tronÃ§on"
      - name: pl
        description: "Nombre de poids lourds brut issu des donnees de comptage"
  
  - name: mdl21a_lin_upd_cmt_cpt_19
    description: >
      Modele de mise a jour du champ commentaire de comptage (coment_cpt).
      Le champ coment_cpt prend la valeur 'linearisation' si src_cpt = 'otv', sinon 'estimation'.
      Base sur la macro [`mcr_21a_maj_cmt_cpt_lin`](/#!/macro/macro.linearisation.mcr_21a_maj_cmt_cpt_lin).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mdl1_creer_vue_19')
            description: "Verifier que le nombre de lignes dans ce modele est identique a celui du modele de base mdl1_creer_vue_19"
    columns:
      - name: id
        description: "Identifiant unique interne OTR genere automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
          - not_null
      - name: coment_cpt
        description: "Commentaire sur la source du comptage : 'linearisation' si src_cpt='otv', sinon 'estimation'"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('coment_cpt_verif') }}"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= 'linearisation'"
                where: "src_cpt = 'otv'"
                description: "Verifier que coment_cpt = 'linearisation' quand src_cpt = 'otv'"
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= 'estimation'"
                where: "src_cpt is null"
                description: "Verifier que coment_cpt = 'estimation' quand src_cpt est null"
      - name: src_cpt
        description: "Source du comptage"
      - name: pl
        description: "Nombre de poids lourds brut issu des donnees de comptage"
  
  - name: mdl22_lin_upd_cmt_tmj_f_estim_19
    description: >
      Modele final de mise a jour du champ `coment_tmj_f` pour l'ensemble des tronÃ§ons.
      Pour les estimations (coment_cpt='estimation' et src_cpt is null), calcule coment_tmj_f selon le sens de circulation.
      Pour les non-estimations, conserve les valeurs existantes.
      C'est le dernier modele de la partie linearisation - tous les tests finaux de validation doivent Ãªtre implementes ici.
      Base sur la macro [`mcr_22_maj_cmt_tmj_f_estim_lin`](/#!/macro/macro.linearisation.mcr_22_maj_cmt_tmj_f_estim_lin).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mdl1_creer_vue_19')
            description: "Verifier que le nombre de lignes dans ce modele est identique a celui du modele de base mdl1_creer_vue_19"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "((id_comptag::text ~ '[0-9]{2}-(A|N|D|B)[0-9]{1,4}.*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(VC|C).*-[0-9]{1,4}\\+[0-9]{1,4}'::text OR id_comptag::text ~ '[0-9]{2}-(PISTE|VC).*--*[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text OR id_comptag::text ~ '[0-9]{2}-DBAC.*'::text OR id_comptag::text ~ '[a-zA-Z]*.*-[a-zA-Z]*.*--?[0-9]\\.[0-9]{0,4};[0-9]{1,2}\\.[0-9]{0,4}'::text) AND (length(id_comptag::text) - length(replace(id_comptag::text, '-'::text, ''::text))) >= 2)"
          config:
            where: "id_comptag is not null"
          description: "Verifier que l'identifiant de comptage respecte les formats OTR"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "CASE WHEN id_comptag IS NULL THEN coment_cpt = 'estimation' WHEN id_comptag IS NOT NULL THEN coment_cpt = 'linearisation' ELSE FALSE END"
            description: "Verifier la coherence entre id_comptag et coment_cpt (null->estimation, non-null->linearisation)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "CASE WHEN coment_cpt = 'estimation' THEN src_cpt IS NULL WHEN coment_cpt = 'linearisation' THEN src_cpt IS NOT NULL ELSE FALSE END"
            description: "Verifier la coherence entre coment_cpt et src_cpt (estimation->null, linearisation->not null)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coment_tmj_f = '/2' OR coment_tmj_f IS NULL"
            where: "coment_cpt = 'estimation' AND src_cpt IS NULL"
            description: "Verifier que pour les estimations, coment_tmj_f vaut '/2' (sens unique) ou null (double sens)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coment_tmj_f = '/2'"
            where: "coment_cpt = 'estimation' AND src_cpt IS NULL AND sens = ANY(ARRAY{{ var('bdtopo_sens_uniq_verif') }})"
            description: "Verifier que coment_tmj_f = '/2' pour les estimations en sens unique"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "coment_tmj_f IS NULL"
            where: "coment_cpt = 'estimation' AND src_cpt IS NULL AND sens = '{{ var('bdtopo_double_sens_verif') }}'"
            description: "Verifier que coment_tmj_f est null pour les estimations en double sens"
    columns:
      - name: id
        description: "Identifiant unique interne OTR genere automatiquement"
        data_tests:
          - unique
          - not_null
      - name: id_ign
        description: "Identifiant unique IGN"
        data_tests:
          - unique
          - not_null
      - name: nature
        description: "Nature de la route selon IGN"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('toute_nature_verif') }}"
      - name: sens
        description: "Sens de circulation du tronÃ§on"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('sens_verif') }}"
                description: "Verifier que IGN n'a pas change ses valeurs de *sens*"
      - name: dept
        description: "Code du departement sur 2 chiffres"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: "{{ var('dept_na') }}"
                description: "Verifier que seules les routes du departement concerne -ou de na- sont presentes"
      - name: long_km
        description: "Longueur du tronÃ§on en km"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.001
                description: "Verifier que la longueur est positive"
      - name: numero
        description: "Numero de la route, hors voies communales"
        data_tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "(A|D|N|P)[0-9]+[A-Z]*[0-9]*"
                row_condition: "numero is not null"
                description: "Verifier que les numeros respectent un format IGN"
      - name: importance
        description: "Classement IGN de hierarchie de reseau"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('importance_verif') }}"
      - name: cl_admin
        description: "Classement administratif IGN (Autoroute, Nationale, Departementale)"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('cl_admin_verif') }}"
              config:
                where: "cl_admin is not null"
      - name: gestion
        description: "Gestionnaire selon l'IGN"
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('gestion_verif') }}"
              config:
                where: "gestion is not null"
      - name: fictif
        description: "Existence reelle ou non de la voie selon l'IGN"
        data_tests:
          - not_null
      - name: largeur
        description: "Largeur de la voie en metres"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 25
                description: "Verifier que la largeur est positive et inferieure a 25m"
              config:
                where: "largeur is not null"
      - name: nb_voies
        description: "Nombre de voies de circulation selon l'IGN"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
                description: "Verifier que le nombre de voies est positif et inferieur a 10"
